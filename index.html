<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRN Pal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F5FA;
    --surface: #FFFFFF;
    --ink: #423F4D;
    --muted: #8D89A0;
    --primary: #8B85B8;
    --primary-dark: #6B6494;
    --primary-deep: #A9D8C9;
    --current: #7FB88F;
    --review: #E0B678;
    --line: #E8E4F0;
    --danger: #C97A72;
  }
  html[data-theme="dark"] {
    --bg: #1C1A24;
    --surface: #262330;
    --ink: #EDEBF5;
    --muted: #9E9AB0;
    --primary: #A79EDB;
    --primary-dark: #C7BFF0;
    --primary-deep: #7FC4AE;
    --current: #7FC48F;
    --review: #E8C589;
    --line: #38344499;
    --danger: #E08A80;
  }
  html[data-theme="dark"] body {
    background-image:
      radial-gradient(circle at 1px 1px, rgba(167,158,219,0.10) 1px, transparent 0);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(139,133,184,0.07) 1px, transparent 0);
    background-size: 24px 24px;
    font-family: 'IBM Plex Sans', sans-serif;
    color: var(--ink);
  }
  #root { display: flex; flex-direction: column; align-items: center; padding: 24px 12px 60px; min-height: 100%; }

  .app-shell {
    width: 420px; max-width: 100%;
    background: var(--surface);
    border-radius: 22px;
    border: 1px solid var(--line);
    box-shadow: 0 20px 48px rgba(15,31,43,0.14);
    overflow: hidden;
    display: flex; flex-direction: column;
    min-height: 660px;
  }

  /* --- Gradient header --- */
  .topbar {
    padding: 20px 20px 16px;
    flex-shrink: 0;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-deep) 100%);
    color: #fff;
  }
  .topbar.plain { background: var(--surface); color: var(--ink); border-bottom: 1px solid var(--line); }
  .topbar-row { display: flex; align-items: center; justify-content: space-between; }
  .wordmark { font-family: 'Source Serif 4', serif; font-size: 25px; font-weight: 600; letter-spacing: -0.01em; }
  .topbar.plain .wordmark { color: var(--ink); }
  .tagline { font-size: 13px; margin-top: 2px; opacity: 0.85; }
  .topbar.plain .tagline { color: var(--muted); opacity: 1; }
  .welcome-line { font-size: 13.5px; margin-top: 10px; opacity: 0.95; font-weight: 500; }

  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.22);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; color: #fff;
    cursor: pointer; flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.35);
  }

  .mode-toggle { display: flex; gap: 4px; background: rgba(255,255,255,0.18); border-radius: 8px; padding: 3px; }
  .mode-btn { border: none; background: transparent; font-family: 'IBM Plex Sans'; font-size: 12px; font-weight: 500; padding: 6px 10px; border-radius: 6px; cursor: pointer; color: rgba(255,255,255,0.85); }
  .mode-btn.active { background: rgba(255,255,255,0.9); color: var(--primary-dark); }

  .theme-toggle {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.22);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; cursor: pointer; flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.35);
    margin-left: 8px; padding: 0;
  }

  .back-row { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .back-arrow { font-size: 18px; line-height: 1; }
  .screen-title { font-family: 'Source Serif 4', serif; font-size: 19px; font-weight: 600; }

  .search-box { margin: 14px 20px 4px; }
  .search-box input {
    width: 100%; padding: 11px 14px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; font-size: 14px; font-family: 'IBM Plex Sans'; color: var(--ink);
  }
  .search-box input::placeholder { color: var(--muted); }

  .calc-shortcuts { margin: 12px 0 4px; }
  .calc-shortcuts-label { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 20px 8px; }
  .calc-shortcuts-row { display: flex; gap: 8px; overflow-x: auto; padding: 0 20px 4px; scrollbar-width: none; }
  .calc-shortcuts-row::-webkit-scrollbar { display: none; }

  .accent-row { display: flex; align-items: center; gap: 10px; margin: 12px 20px 4px; }
  .accent-row-label { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  .accent-swatch {
    width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; padding: 0; flex-shrink: 0;
  }
  .accent-swatch.active { border-color: var(--ink); }
  .calc-chip {
    flex-shrink: 0; display: flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
    padding: 8px 14px; font-size: 12.5px; font-weight: 500; color: var(--ink);
    cursor: pointer; white-space: nowrap;
  }
  .calc-chip:active { background: var(--bg); }
  .calc-chip-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }

  .body-scroll { flex: 1; overflow-y: auto; }

  .section-label { font-size: 12px; color: var(--muted); padding: 16px 20px 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background 0.12s; }
  .row:hover { background: #F7FAFA; }
  html[data-theme="dark"] .row:hover { background: #2E2A3B; }
  .row-main { min-width: 0; flex: 1; }
  .row-title { font-family: 'Source Serif 4', serif; font-size: 16px; font-weight: 500; line-height: 1.3; }
  .row-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .chevron { color: var(--primary); font-size: 16px; flex-shrink: 0; opacity: 0.5; }
  .star-btn {
    border: none; background: transparent; cursor: pointer; font-size: 19px; line-height: 1;
    color: var(--line); flex-shrink: 0; padding: 4px;
  }
  .star-btn.starred { color: var(--review); }
  .star-btn.detail-star { font-size: 22px; }
  .view-count-badge { font-size: 12px; color: var(--muted); white-space: nowrap; }

  .specialty-icon {
    width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
    background: linear-gradient(135deg, rgba(14,165,160,0.14), rgba(20,108,148,0.14));
    color: var(--primary-deep, var(--primary));
    display: flex; align-items: center; justify-content: center;
  }

  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; margin-top: 6px; }
  .tag-current { background: #E4F7EC; color: var(--current); }
  .tag-review { background: #FBEEDC; color: var(--review); }
  .tag-neutral { background: #EEF2F5; color: var(--muted); }
  html[data-theme="dark"] .tag-current { background: #24382C; }
  html[data-theme="dark"] .tag-review { background: #3A3323; }
  html[data-theme="dark"] .tag-neutral { background: #2E2C38; }

  .detail-body { padding: 22px 20px; }
  .detail-title { font-family: 'Source Serif 4', serif; font-size: 21px; font-weight: 600; line-height: 1.3; margin-bottom: 8px; }
  .detail-meta { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .detail-tags { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .detail-section { margin-bottom: 20px; }
  .detail-heading { font-size: 11.5px; color: var(--muted); font-weight: 600; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .detail-text { font-size: 14.5px; line-height: 1.6; white-space: pre-wrap; }
  .key-points { display: flex; flex-direction: column; gap: 8px; }
  .key-point {
    display: flex; align-items: flex-start; gap: 11px;
    padding: 11px 13px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px;
  }
  .key-num {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-deep, var(--primary)));
    color: #fff; font-size: 11.5px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    margin-top: 1px;
  }
  .key-text { font-size: 14px; line-height: 1.5; color: var(--ink); }
  .key-text strong { color: var(--primary-deep, var(--primary)); font-weight: 700; }
  .key-section-title {
    font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--accent, var(--primary)); margin: 16px 0 8px;
  }
  .key-section-title:first-child { margin-top: 0; }

  .calc-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .calc-page-card {
    margin: 0 20px 12px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden;
  }
  .calc-page-card-header {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 14px 16px; cursor: pointer;
  }
  .calc-page-card-body { padding: 0 16px 16px; }
  .calc-page-card .row-title { margin-bottom: 2px; }
  .calc-page-card .row-sub { margin-top: 0; }
  .calc-item { display: flex; align-items: center; gap: 10px; font-size: 13.5px; cursor: pointer; }
  .calc-item input { width: 17px; height: 17px; accent-color: var(--primary); flex-shrink: 0; }
  .calc-subgroup { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 2px; display: flex; flex-direction: column; gap: 8px; }
  .calc-subgroup-label { font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .calc-result {
    margin-top: 4px; padding: 12px 14px; border-radius: 10px; background: var(--bg);
    display: flex; flex-direction: column; gap: 4px; font-size: 13.5px;
  }
  .calc-score { font-weight: 700; font-size: 14.5px; color: var(--ink); }
  .calc-low { color: var(--current); font-weight: 500; }
  .calc-mid { color: var(--review); font-weight: 500; }
  .calc-high { color: var(--danger); font-weight: 600; }
  .keyword-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .keyword { font-size: 12px; background: var(--bg); border: 1px solid var(--line); padding: 4px 10px; border-radius: 20px; }
  .btn { display: inline-block; text-align: center; font-size: 14px; font-weight: 600; padding: 12px; border-radius: 10px; border: none; cursor: pointer; font-family: 'IBM Plex Sans'; text-decoration: none; }
  .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-deep)); color: #fff; width: 100%; box-shadow: 0 6px 16px rgba(14,165,160,0.32); }
  .btn-primary:hover { filter: brightness(1.05); }
  .btn-secondary { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
  .btn-danger { background: #FDEDEC; color: var(--danger); border: 1px solid #F5C9C5; }
  html[data-theme="dark"] .btn-danger { background: #3A2A28; border: 1px solid #5A3A36; }
  .btn-row { display: flex; gap: 10px; margin-top: 18px; }
  .btn-row .btn { flex: 1; }

  .empty-state { padding: 60px 30px; text-align: center; color: var(--muted); font-size: 14px; }

  .form-body { padding: 20px; overflow-y: auto; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    font-family: 'IBM Plex Sans'; font-size: 14px; color: var(--ink); background: var(--surface);
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(14,165,160,0.15); }
  .field textarea { resize: vertical; min-height: 70px; }
  .manage-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  .manage-row .row-title { font-size: 15px; }
  .icon-btn { border: none; background: transparent; cursor: pointer; font-size: 13px; color: var(--muted); padding: 4px 8px; font-weight: 500; }
  .icon-btn:hover { color: var(--primary); }
  .fab { position: sticky; bottom: 0; margin: 14px 20px 20px; }

  .loading { padding: 60px 20px; text-align: center; color: var(--muted); font-size: 14px; }
  .footnote { max-width: 420px; margin-top: 18px; font-size: 12px; color: var(--muted); line-height: 1.6; text-align: center; }
  .footnote.disclaimer { margin-top: 10px; opacity: 0.85; padding: 0 12px; }

  /* --- Signup gate --- */
  .signup-wrap {
    background: linear-gradient(150deg, var(--primary) 0%, var(--primary-deep) 100%);
    padding: 46px 30px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    color: #fff; flex: 1; justify-content: center;
  }
  .signup-wordmark { font-family: 'Source Serif 4', serif; font-size: 32px; font-weight: 700; margin-bottom: 6px; }
  .signup-sub { font-size: 14px; opacity: 0.9; margin-bottom: 24px; max-width: 290px; line-height: 1.5; }
  .signup-badge {
    width: 56px; height: 56px; border-radius: 16px; margin-bottom: 14px;
    background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.25);
    display: flex; align-items: center; justify-content: center;
  }
  .signup-greeting { font-size: 14px; opacity: 0.85; margin-bottom: 4px; }
  .signup-slogan { font-size: 14.5px; font-weight: 500; opacity: 0.95; margin-bottom: 14px; }
  .signup-specialties { display: flex; gap: 8px; margin-bottom: 26px; }
  .signup-spec-chip {
    width: 34px; height: 34px; border-radius: 10px; color: #fff;
    background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.22);
    display: flex; align-items: center; justify-content: center;
  }
  .signup-spec-chip svg { width: 16px; height: 16px; }
  .signup-card {
    background: #fff; border-radius: 16px; padding: 22px; width: 100%; max-width: 300px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.18); text-align: left;
  }
  .signup-card .field label { color: var(--muted); }
  .signup-card input { color: var(--ink); }
</style>

<!-- ── Firebase (replaces Claude's window.storage outside the Claude environment) ──
     Fill in YOUR_FIREBASE_CONFIG below with values from your own Firebase project
     (Project Settings → General → Your apps → SDK setup and configuration).
     See the setup checklist provided alongside this file for the full walkthrough. -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "PASTE_YOUR_API_KEY",
    authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
    projectId: "PASTE_YOUR_PROJECT_ID",
    storageBucket: "PASTE_YOUR_PROJECT.appspot.com",
    messagingSenderId: "PASTE_YOUR_SENDER_ID",
    appId: "PASTE_YOUR_APP_ID"
  };

  firebase.initializeApp(firebaseConfig);
  const _db = firebase.firestore();
  const _auth = firebase.auth();

  let _uid = null;
  let _firebaseUnavailable = false;
  const _authReady = new Promise((resolve) => {
    _auth.onAuthStateChanged((user) => {
      if (user) {
        _uid = user.uid;
        resolve(user.uid);
      } else {
        _auth.signInAnonymously().catch((err) => console.error('Anonymous sign-in failed', err));
      }
    });
    // Safety net: if Firebase isn't reachable or isn't configured yet (e.g. the
    // placeholder config values above haven't been replaced), don't hang the
    // whole app forever waiting on a sign-in that will never succeed. Fall back
    // to "no persistence" after 4s so the app still boots and works normally.
    setTimeout(() => {
      if (!_uid) {
        console.warn('Firebase did not respond in time — continuing without persistence. Check your firebaseConfig values.');
        _firebaseUnavailable = true;
        resolve(null);
      }
    }, 4000);
  });

  function _docRef(key, shared) {
    return shared
      ? _db.collection('shared_data').doc(key)
      : _db.collection('users').doc(_uid).collection('data').doc(key);
  }

  function _collectionRef(shared) {
    return shared
      ? _db.collection('shared_data')
      : _db.collection('users').doc(_uid).collection('data');
  }

  // Matches the exact interface the app already calls everywhere:
  // get/set/delete/list(key, shared). get() throws (not returns null) on a
  // missing key, matching the behavior the app's try/catch blocks expect.
  window.storage = {
    async get(key, shared = false) {
      await _authReady;
      if (_firebaseUnavailable) throw new Error('Storage unavailable (Firebase not configured)');
      const snap = await _docRef(key, shared).get();
      if (!snap.exists) throw new Error(`Key not found: ${key}`);
      const data = snap.data();
      return { key, value: data.value, shared };
    },
    async set(key, value, shared = false) {
      await _authReady;
      if (_firebaseUnavailable) return null;
      await _docRef(key, shared).set({
        key,
        value,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      return { key, value, shared };
    },
    async delete(key, shared = false) {
      await _authReady;
      if (_firebaseUnavailable) return null;
      await _docRef(key, shared).delete();
      return { key, deleted: true, shared };
    },
    async list(prefix = '', shared = false) {
      await _authReady;
      if (_firebaseUnavailable) return { keys: [], prefix: prefix || undefined, shared };
      let query = _collectionRef(shared);
      if (prefix) {
        query = query.where('key', '>=', prefix).where('key', '<', prefix + '\uf8ff');
      }
      const snap = await query.get();
      return { keys: snap.docs.map((d) => d.data().key), prefix: prefix || undefined, shared };
    },
  };
</script>
<!-- ── end Firebase storage shim ── -->
