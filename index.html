    status: 'Current',
    summary: '## Stroke risk (CHA₂DS₂-VASc)\nScoring (1 pt each unless noted): CHF, hypertension, diabetes, vascular disease (PAD/MI/aortic plaque), age 65–74, female sex; 2 pts each for age ≥75 and prior stroke/TIA.\nThreshold: anticoagulate at score ≥2 in men, ≥3 in women — consider at 1 (men) / 2 (women), generally not needed at 0 (men) / 1 (women, sex-only point).\n## Anticoagulation\nDrug choice: DOACs (apixaban, rivaroxaban, dabigatran, edoxaban) preferred over warfarin for non-valvular AFib.\nWarfarin required for: mechanical heart valves or moderate-to-severe mitral stenosis — DOACs are not validated here.\n## Rate vs. rhythm control\nEarly rhythm control (within 1 year of diagnosis) improves cardiovascular outcomes vs. rate control alone in appropriate candidates.\nAblation: reasonable as first-line therapy in symptomatic paroxysmal AFib, not only after drug failure.\n## Reversible contributors to screen for\nOSA, hyperthyroidism, heavy alcohol use, obesity, uncontrolled hypertension — treating these can reduce recurrence.\n## Red flags\nRVR with hemodynamic instability (hypotension, altered mental status, chest pain, decompensated HF) needs urgent rate/rhythm control, not outpatient management.',
    evidence: 'Class I, Level B', link: 'https://www.ahajournals.org/doi/10.1161/CIR.0000000000001193',
    tags: 'afib, arrhythmia, anticoagulation', notes: '' },
  { id: 'g3', specialty: 'Endocrinology', subspecialty: 'Diabetes', topic: 'Standards of Care in Diabetes',
    name: 'ADA Standards of Care in Diabetes — 2025', source: 'ADA', year: '2025',
    status: 'Current',
    summary: '## Glycemic targets\nA1c: individualize — ~7% for most adults, relax to 7.5–8% for older adults or limited life expectancy.\nInitial combo therapy: consider when presenting A1c is 1.5–2.0% above goal, or with high/established CVD risk — don\'t always wait to fail metformin first.\n## Drug selection — organ protection over glucose-only thinking\nASCVD, HF, or CKD present: start an SGLT2 inhibitor and/or GLP-1 RA with proven cardiovascular benefit — independent of baseline A1c or metformin status.\nSGLT2 inhibitors: still reduce CKD progression and HF risk down to eGFR ~20; glycemic effect drops below eGFR 45.\nIf eGFR <30: GLP-1 RA becomes the preferred agent over SGLT2i for glycemic control.\nMetformin: still reasonable first-line for patients without compelling cardiorenal indications above; not mandatory before starting SGLT2i/GLP-1 RA.\n## Insulin\nStart insulin for: A1c >10%, or symptomatic hyperglycemia (polyuria, polydipsia, unintended weight loss, ketosis).\nPrefer GLP-1 RA/GIP-GLP-1 RA over insulin when there is no evidence of insulin deficiency.\n## Monitoring\nScreening: urine albumin-creatinine ratio and eGFR annually for kidney disease.\nCGM: recommend for all patients on insulin, not just type 1.\nBP target: <130/80 mmHg in most adults with diabetes; <120/80 in those with CKD, using ACEi/ARB if albuminuric.',
    evidence: 'Grade A', link: 'https://diabetesjournals.org/care', tags: 'diabetes, GLP-1, SGLT2', notes: '' },
  { id: 'g4', specialty: 'Endocrinology', subspecialty: 'Thyroid', topic: 'Management of Hypothyroidism',
    name: 'ATA Guidelines for Hypothyroidism', source: 'ATA', year: '2014',
    status: 'Needs Review',
    summary: '## Diagnosis\nNormal ranges (lab-dependent): TSH 0.4–4.5 mIU/L; free T4 0.8–1.8 ng/dL.\nOvert hypothyroidism: TSH >4.5 mIU/L with free T4 below the lab\'s normal range (commonly <0.8 ng/dL).\nSubclinical, mild: TSH 4.5–10 mIU/L with normal free T4 — treatment decision depends on symptoms, TPO antibody status, and cardiovascular risk, not TSH alone.\nSubclinical, marked: TSH >10 mIU/L with normal free T4 — treatment is generally recommended even without symptoms.\n## First-line therapy\nLevothyroxine monotherapy remains standard first-line treatment for essentially all patients.\nDosing: start ~1.6 mcg/kg/day in otherwise healthy adults; start lower (25–50 mcg/day) and titrate slowly in elderly patients or those with cardiac disease.\nAdministration: take on an empty stomach, 30–60 min before food, separated from calcium/iron/PPIs which impair absorption.\n## Monitoring\nRecheck TSH 6–8 weeks after any dose change before further titration — do not adjust more frequently than this.\nOnce stable (TSH in the 0.4–4.5 mIU/L target range), recheck annually, or sooner if symptoms change or new interacting medications are started.\n## When symptoms persist\nCombination T3/T4 therapy: consider only in patients with persistent symptoms despite a normalized TSH on levothyroxine alone — not first-line.\nRule out other causes of persistent symptoms (depression, anemia, other endocrinopathies) before attributing to inadequate thyroid replacement.',
    evidence: 'Expert Opinion', link: 'https://www.thyroid.org', tags: 'thyroid, levothyroxine', notes: 'Check for a newer ATA statement before relying on this fully — combination therapy guidance has evolved since 2014.' },
  { id: 'g5', specialty: 'Infectious Disease', subspecialty: 'Respiratory', topic: 'Community-Acquired Pneumonia',
    calculator: 'curb65',
    name: 'IDSA/ATS Guideline on Community-Acquired Pneumonia', source: 'IDSA/ATS', year: '2019',
    status: 'Current',
    summary: '## Risk stratification (CURB-65)\nScoring: 1 point each for Confusion, Urea >7 mmol/L (BUN >19 mg/dL), Respiratory rate ≥30/min, low Blood pressure (SBP <90 or DBP ≤60), Age ≥65.\nDisposition: score 0–1 → outpatient management; score 2 → consider short inpatient stay; score ≥3 → inpatient, consider ICU-level care.\nCaveat: PSI/PORT score is slightly more accurate but more complex — CURB-65 favored for bedside simplicity.\n## Outpatient treatment\nNo comorbidities: amoxicillin, doxycycline, or azithromycin — use a macrolide only if local pneumococcal resistance is <25%.\nWith comorbidities (heart/lung/liver/renal disease, diabetes, alcoholism, asplenia, immunosuppression): combination beta-lactam + macrolide, or a respiratory fluoroquinolone alone.\n## Inpatient treatment\nNon-severe: beta-lactam + macrolide, or respiratory fluoroquinolone monotherapy.\nSevere/ICU: beta-lactam + macrolide or fluoroquinolone; add coverage for Pseudomonas or MRSA only with specific risk factors (prior isolation, recent hospitalization with IV antibiotics, structural lung disease).\n## Follow-up\nRoutine repeat chest imaging is not recommended if the patient improves clinically as expected.\nConsider repeat imaging only if symptoms fail to improve, worsen, or the patient is at higher risk for underlying malignancy (e.g. smoker, older age).',
    evidence: 'Strong', link: 'https://www.idsociety.org', tags: 'pneumonia, CAP, antibiotics', notes: '' },
  { id: 'g6', specialty: 'Cardiology', subspecialty: 'Venous thromboembolism', topic: 'Acute Pulmonary Embolism',
    calculator: 'wellspe',
    name: '2026 AHA/ACC Guideline for the Evaluation and Management of Acute Pulmonary Embolism in Adults', source: 'AHA/ACC/ACCP/ACEP/CHEST/SCAI/SHM/SIR/SVM/SVN', year: '2026',
    status: 'Current',
    summary: '## Diagnosis / workup\nSuspected PE: use the Wells PE calculator below to estimate clinical probability and guide whether D-dimer or direct CT pulmonary angiography is the right next step.\n## Risk classification\nNew system: AHA/ACC Acute PE Clinical Categories (A–E, with subcategories) replace older massive/submassive/non-massive labels — ranges from lowest to highest risk of adverse outcomes.\nCategory A: asymptomatic PE (often incidental).\nCategory B: symptomatic, low clinical severity score.\nCategory C: symptomatic with elevated severity score, elevated biomarkers, and/or RV dysfunction.\nCategory D: incipient cardiopulmonary failure.\nCategory E: cardiopulmonary failure with persistent hypotension (the classic "massive PE").\n## Disposition\nCategory A: can be safely discharged home from the ED — hospitalization not needed.\nCategory B: early hospital discharge is generally reasonable.\nCategory C, D, and E: hospitalize to optimize treatment.\nActivate a PE Response Team (PERT) for higher-severity categories — associated with faster, better-coordinated care.\n## Anticoagulation\nInitial parenteral therapy: low-molecular-weight heparin (LMWH) preferred over unfractionated heparin (UFH) when there is a choice.\nOral anticoagulation: DOACs preferred over vitamin K antagonists (warfarin) for eligible patients — lower major bleeding, similar efficacy.\nDuration: continue anticoagulation beyond the initial 3–6 month treatment phase (into extended-phase therapy) for a first PE without a major reversible risk factor, or with a persistent risk factor.\n## Advanced therapies\nCategory E1: systemic thrombolysis, catheter-based thrombolysis, mechanical thrombectomy, or surgical embolectomy are reasonable.\nCategory D1–D2: advanced therapies can be considered, individualized to the patient.\n## Long-term follow-up\nScreen for chronic thromboembolic pulmonary disease (CTEPD) or persistent dyspnea/functional limitation by asking about PE-related symptoms at every visit for at least 1 year after the event.',
    evidence: 'Class I–IIb (mixed)', link: 'https://www.ahajournals.org/doi/10.1161/CIR.0000000000001415', tags: 'pulmonary embolism, PE, DOAC, anticoagulation, VTE', notes: 'De novo 2026 guideline — introduces the new AHA/ACC PE Clinical Category system, replacing older massive/submassive terminology. Worth a full read given how new this classification is.' },
  { id: 'g7', specialty: 'Cardiology', subspecialty: 'Hypertension', topic: 'Management of High Blood Pressure',
    calculator: '',
    externalToolLabel: 'Open the official PREVENT risk calculator', externalToolUrl: 'https://professional.heart.org/prevent',
    name: '2025 AHA/ACC Guideline for High Blood Pressure in Adults', source: 'AHA/ACC (+11 societies)', year: '2025',
    status: 'Current',
    summary: '## Classification\nNormal: <120/80 mmHg.\nElevated: 120–129 systolic and <80 diastolic.\nStage 1: 130–139 systolic or 80–89 diastolic.\nStage 2: ≥140 systolic or ≥90 diastolic.\nHypertensive crisis: ≥180 systolic or ≥120 diastolic — evaluate for end-organ damage immediately.\n## Diagnosis & risk assessment\nConfirm with out-of-office readings: home BP monitoring or ambulatory monitoring before diagnosing hypertension from office readings alone.\nRisk calculator: use PREVENT (replaces the older Pooled Cohort Equations) to estimate 10- and 30-year cardiovascular risk — incorporates eGFR, statin use, and social risk factors.\n## Treatment targets\nUniversal target: <130/80 mmHg for essentially all treated adults, including most older adults — narrower exceptions than the 2017 guideline.\nStart medication: BP ≥140/90 in all patients, or ≥130/80 if high estimated cardiovascular risk, or existing cardiovascular disease, diabetes, or CKD.\nStage 2: preferentially start with a single-pill dual-class combination rather than one drug at a time — improves adherence and speeds control.\n## First-line drug classes\nRace-neutral first-line options: thiazide diuretic, ACE inhibitor, ARB, or dihydropyridine calcium channel blocker — chosen by comorbidities, not race.\nCompelling indications: CKD/albuminuria favors ACEi/ARB; avoid combining ACEi + ARB together.\n## Special populations\nResistant hypertension (uncontrolled on 3+ drugs including a diuretic): screen for primary aldosteronism — now recommended for all patients with stage 2 or resistant hypertension, not just those with hypokalemia.\nRefractory resistant hypertension: renal denervation is a reasonable adjunctive option in select patients after optimizing medical therapy.\nPregnancy: individualized targets differ from the general adult population — do not apply the <130/80 target directly.\n## Lifestyle (foundational for all patients)\nSodium reduction, weight loss, DASH-pattern diet, regular aerobic activity, alcohol moderation, stress management — reinforce at every visit, not only at diagnosis.',
    evidence: 'Class I (majority)', link: 'https://professional.heart.org/en/science-news/2025-high-blood-pressure-guideline', tags: 'hypertension, blood pressure, PREVENT, cardiovascular risk', notes: 'First major update since 2017. PREVENT is a complex 12-variable regression model, not a simple point score — use the official AHA calculator linked below for an accurate risk estimate rather than a homemade approximation.' },
  { id: 'g8', specialty: 'Critical Care', subspecialty: 'Sepsis', topic: 'Recognition and Management of Sepsis and Septic Shock',
    calculator: 'qsofa',
    name: 'Surviving Sepsis Campaign: International Guidelines for Management of Sepsis and Septic Shock', source: 'SCCM/ESICM', year: '2021',
    status: 'Needs Review',
    summary: '## Recognition\nqSOFA (below): a rapid bedside prompt for possible sepsis outside the ICU — not diagnostic and not part of the formal Sepsis-3 criteria, but a score ≥2 should trigger further workup.\nFormal diagnosis (Sepsis-3): suspected infection plus an acute increase in SOFA score ≥2 points, reflecting organ dysfunction.\nSeptic shock: sepsis with persistent hypotension requiring vasopressors to maintain MAP ≥65 mmHg AND lactate >2 mmol/L despite adequate fluid resuscitation.\n## Initial resuscitation ("Hour-1 bundle")\nMeasure lactate; remeasure if initial lactate >2 mmol/L.\nObtain blood cultures before antibiotics, but do not delay antibiotics for a meaningful amount of time to get them.\nAdminister broad-spectrum antibiotics within 1 hour of recognizing sepsis or septic shock.\nBegin rapid administration of 30 mL/kg IV crystalloid for hypotension or lactate ≥4 mmol/L.\nApply vasopressors if hypotensive during or after fluid resuscitation to maintain MAP ≥65 mmHg.\n## Antibiotics & source control\nEmpiric therapy: broad-spectrum, covering likely pathogens based on suspected source and local resistance; reassess and de-escalate daily once cultures return.\nSource control: identify and address the anatomic source (drain an abscess, remove an infected line) as rapidly as possible.\n## Fluids beyond the first hour\nReassess volume status with dynamic measures (passive leg raise, pulse pressure variation) rather than static measures alone; avoid indiscriminate ongoing boluses once perfusion is restored.\n## Vasopressors & adjuncts\nFirst-line vasopressor: norepinephrine. Add vasopressin as a second agent to reduce norepinephrine dose if MAP remains inadequate.\nCorticosteroids: consider IV hydrocortisone in septic shock if fluids and vasopressors are not restoring hemodynamic stability.\n## Monitoring\nTrend lactate clearance — a falling lactate over time correlates with improved outcomes.\nReassess daily for de-escalation of antibiotics and continued need for vasopressors/organ support.',
    evidence: 'Strong (majority)', link: 'https://www.sccm.org/SurvivingSepsisCampaign/Guidelines', tags: 'sepsis, septic shock, qSOFA, SOFA, critical care', notes: 'Marked Needs Review — this is the 2021 edition; check for a newer Surviving Sepsis Campaign update before relying on it for anything unusual.' },
  { id: 'g9', specialty: 'Geriatrics', subspecialty: 'Prescribing safety', topic: 'Potentially Inappropriate Medications in Older Adults',
    calculator: '',
    name: 'American Geriatrics Society (AGS) Beers Criteria', source: 'AGS', year: '2023',
    status: 'Current',
    summary: '## Purpose\nIdentifies potentially inappropriate medications (PIMs) in adults ≥65 to guide deprescribing conversations — not an absolute prohibition list; clinical judgment and patient goals still apply.\n## Avoid in most older adults\nAnticholinergics (first-generation antihistamines like diphenhydramine, hydroxyzine): increased confusion, dry mouth, constipation, falls.\nBenzodiazepines (all, regardless of duration): increased cognitive impairment, delirium, falls, fractures, motor vehicle accidents.\nNon-benzodiazepine hypnotics ("Z-drugs": zolpidem, eszopiclone): similar risk profile to benzodiazepines.\nLong-acting sulfonylureas (e.g. glyburide): prolonged hypoglycemia risk.\nMuscle relaxants (cyclobenzaprine, carisoprodol): poorly tolerated, anticholinergic effects, sedation.\nChronic oral NSAIDs (non-selective): GI bleeding and renal risk, especially with concurrent steroids, anticoagulants, or CKD.\n## Avoid in specific conditions\nHeart failure: avoid NSAIDs and non-dihydropyridine calcium channel blockers (diltiazem, verapamil) — can worsen fluid retention or have negative inotropic effects.\nDementia/cognitive impairment: avoid anticholinergics and benzodiazepines — worsen cognition.\nHistory of falls/fractures: avoid benzodiazepines, Z-drugs, opioids, and anticonvulsants when possible.\nCKD (eGFR <30): avoid NSAIDs and agents requiring renal adjustment or with accumulating toxic metabolites.\n## Drug-drug interactions to flag\nAvoid combining ≥3 CNS-active drugs (opioids, antidepressants, benzodiazepines, antipsychotics, anticonvulsants) — cumulative fall/delirium risk.\nACEi/ARB + potassium-sparing diuretic or potassium supplement: hyperkalemia risk — monitor closely if combined.\nWarfarin + NSAID or antiplatelet: bleeding risk — avoid unless specifically indicated and monitored.\n## Practical approach\nBefore adding a new medication in a patient ≥65: ask whether it is treating a symptom actually caused by another medication (a prescribing cascade).\nDeprescribing: reassess long-term medications regularly — many PIMs are continued out of habit rather than ongoing need.',
    evidence: 'Expert consensus', link: 'https://geriatricscareonline.org', tags: 'geriatrics, polypharmacy, deprescribing, Beers criteria', notes: 'Paraphrased summary of major categories — always check the full AGS table for a specific drug before making a prescribing decision.' },
  { id: 'g10', specialty: 'Pulmonology', subspecialty: 'COPD', topic: 'Diagnosis and Management of COPD',
    calculator: 'goldabe',
    name: 'GOLD 2026 Global Strategy for the Diagnosis, Management, and Prevention of COPD', source: 'GOLD', year: '2026',
    status: 'Current',
    summary: '## Diagnosis\nSpirometry required: post-bronchodilator FEV1/FVC <0.7 confirms persistent airflow limitation in the appropriate clinical context.\nAsk about: chronic dyspnea, cough, sputum production, exacerbation history, and exposure risk factors (smoking, biomass fuel, occupational exposures).\n## GOLD ABE classification\nUse symptom burden (mMRC ≥2 or CAT ≥10 = high symptoms) plus exacerbation history to classify into Group A, B, or E using the calculator below.\n2026 update: Group E threshold lowered to ≥1 moderate or severe exacerbation in the past year (previously ≥2, or ≥1 hospitalization) — more patients now qualify as high exacerbation risk.\nGroup E status drives initial therapy choice more than symptom burden alone.\n## Initial pharmacologic therapy by group\nGroup A: a single bronchodilator (long-acting preferred, LAMA or LABA).\nGroup B: LAMA + LABA combination — dual bronchodilation preferred over monotherapy for higher symptom burden.\nGroup E: LAMA + LABA, adding an inhaled corticosteroid (triple therapy) if blood eosinophils ≥300 cells/µL.\n## Follow-up and escalation\nIf breathless despite therapy: check inhaler technique and adherence before escalating; escalate bronchodilator therapy or add ICS if eosinophils support it.\nAdd-on for continued exacerbations despite triple therapy: roflumilast if chronic bronchitis phenotype with FEV1 <50%; azithromycin especially in former smokers.\n## Non-pharmacologic\nSmoking cessation: the single most effective intervention to slow disease progression — address at every visit.\nPulmonary rehabilitation: recommended for persistent symptoms or after a hospitalization for exacerbation.\nVaccinations: influenza, pneumococcal, COVID-19, and RSV (in eligible age groups) reduce exacerbation risk.\n## Exacerbation management\nAssess severity, give short-acting bronchodilators, consider a short course (typically 5 days) of systemic corticosteroids, and antibiotics if increased sputum purulence.\nLong-term oxygen: indicated for resting hypoxemia (SpO2 ≤88% or PaO2 ≤55 mmHg) — improves survival in eligible patients.',
    evidence: 'Class I–II (mixed)', link: 'https://goldcopd.org', tags: 'COPD, GOLD, mMRC, CAT, bronchodilator', notes: 'Reflects the 2026 update to the ABE tool (lower Group E exacerbation threshold). Recheck annually — GOLD updates yearly.' },
  { id: 'g11', specialty: 'Preventive Medicine', subspecialty: 'Cancer screening', topic: 'Breast Cancer Screening',
    calculator: '',
    name: 'USPSTF: Screening for Breast Cancer', source: 'USPSTF', year: '2024',
    status: 'Current',
    summary: '## Recommendation\nAges 40\u201374: biennial screening mammography, average risk. (Grade B)\nAge \u226575: insufficient evidence to assess benefit vs harm. (I statement)\nDense breasts, negative mammogram: insufficient evidence for supplemental ultrasound or MRI. (I statement)\n## 2024 update\nStarting age: lowered from 50 to 40.\nWhy: rising incidence in women in their 40s, and a push to narrow racial disparities in breast cancer mortality.\nInterval: stayed biennial, not annual \u2014 captures most of the mortality benefit with fewer false positives.\n## Who this does not cover\nHigher-risk patients (BRCA mutation, prior chest radiation, strong family history) need earlier or more intensive screening \u2014 refer for risk assessment.\nOther societies differ: ACR/ACS recommend annual screening, sometimes starting earlier \u2014 expect patients to have heard different advice.\n## Practical notes\nEquity matters here: all abnormal results need timely follow-up \u2014 delayed workup disproportionately affects outcomes in Black women.',
    evidence: 'Grade B (ages 40-74); I statement (\u226575 and dense-breast supplemental imaging)', link: 'https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/breast-cancer-screening', tags: 'USPSTF, breast cancer, mammography, cancer screening', notes: 'Major 2024 update lowered the starting age from 50 to 40. Different from ACR/ACS advice (annual, sometimes starting earlier).' },
  { id: 'g12', specialty: 'Preventive Medicine', subspecialty: 'Cancer screening', topic: 'Cervical Cancer Screening',
    calculator: 'cervicalscreen',
    name: 'USPSTF: Screening for Cervical Cancer', source: 'USPSTF', year: '2018 (update pending)',
    status: 'Needs Review',
    summary: '## Recommendation (2018 \u2014 still the official statement)\nAges 21\u201329: cytology alone every 3 years. (Grade A)\nAges 30\u201365: three equally acceptable options \u2014 cytology alone every 3 years, hrHPV alone every 5 years, or co-testing every 5 years. (Grade A)\nDo not screen: age <21, age >65 with adequate prior negative screening, or after hysterectomy with cervix removed for benign disease. (Grade D)\n## Update in progress\n2024 draft: proposes hrHPV primary screening as the preferred option starting at 30, plus self-collected samples.\nStatus: still a draft \u2014 the 2018 recommendation above remains official until finalized.\n## Who this does not apply to\nExcludes HIV-positive patients, prior high-grade lesion, or in utero DES exposure \u2014 these need specialist-guided surveillance.\n## Practical notes\nHPV vaccination does not change the screening schedule.\nAbnormal results: manage per ASCCP consensus guidelines, not a simple repeat test.',
    evidence: 'Grade A (screening 21-65 per protocol above); Grade D (screening outside these criteria)', link: 'https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/cervical-cancer-screening', tags: 'USPSTF, cervical cancer, Pap smear, HPV, cancer screening', notes: 'Marked Needs Review \u2014 a 2024 draft update (not yet finalized) would make HPV primary screening preferred starting at 30 and add self-collection.' },
  { id: 'g13', specialty: 'Preventive Medicine', subspecialty: 'Cancer screening', topic: 'Colorectal Cancer Screening',
    calculator: 'crcscreen',
    name: 'USPSTF: Screening for Colorectal Cancer', source: 'USPSTF', year: '2021',
    status: 'Current',
    summary: '## Recommendation\nAges 45\u201349: Grade B.\nAges 50\u201375: Grade A.\nAges 76\u201385: selective, based on health, prior screening, and preference. (Grade C)\nAge >85: not recommended.\n## Screening options (all acceptable \u2014 no preferred modality)\nColonoscopy: every 10 years.\nFIT or high-sensitivity guaiac FOBT: annual.\nFIT-DNA (stool DNA): every 1\u20133 years.\nFlexible sigmoidoscopy: every 5 years, or every 10 years plus annual FIT.\nCT colonography: every 5 years.\n## Why 45, not 50\nRising incidence in adults under 50 drove the 2021 age reduction.\n## Practical notes\nA positive non-colonoscopy test needs a follow-up colonoscopy to complete the workup \u2014 this step is commonly missed.\nHigher-risk patients (family history, IBD, Lynch/FAP) need earlier, more intensive screening outside this framework.',
    evidence: 'Grade A (50-75); Grade B (45-49); Grade C (76-85)', link: 'https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/colorectal-cancer-screening', tags: 'USPSTF, colorectal cancer, colonoscopy, FIT, cancer screening', notes: 'All listed modalities are considered similarly effective \u2014 the best test is the one the patient will actually complete.' },
  { id: 'g14', specialty: 'Preventive Medicine', subspecialty: 'Cancer screening', topic: 'Lung Cancer Screening',
    calculator: 'lungscreen',
    name: 'USPSTF: Screening for Lung Cancer', source: 'USPSTF', year: '2021',
    status: 'Current',
    summary: '## Recommendation\nEligible: age 50\u201380, \u226520 pack-years, and currently smoking or quit within the past 15 years. (Grade B)\nScreening: annual low-dose CT (LDCT).\nStop when: 15 years smoke-free, or a health problem limits life expectancy or candidacy for curative surgery.\n## Why the 2021 update expanded eligibility\nAge threshold: lowered from 55 to 50.\nPack-year threshold: lowered from 30 to 20.\nWhy: captures more women and Black patients, who tend to develop lung cancer at lower cumulative exposure.\n## Practical notes\nShared decision-making is required before ordering \u2014 discuss false positives, incidental findings, and downstream workup risk.\nUse Lung-RADS to standardize follow-up of findings.\nOffer smoking cessation counseling at every visit, regardless of screening status.',
    evidence: 'Grade B', link: 'https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/lung-cancer-screening', tags: 'USPSTF, lung cancer, low-dose CT, LDCT, smoking, cancer screening', notes: 'Requires a documented shared decision-making conversation, not just an order.' },
  { id: 'g15', specialty: 'Preventive Medicine', subspecialty: 'Bone health', topic: 'Osteoporosis Screening',
    calculator: 'osteoscreen',
    externalToolLabel: 'Open the official FRAX calculator', externalToolUrl: 'https://frax.sheffield.ac.uk/frax/index.aspx',
    name: 'USPSTF: Screening for Osteoporosis to Prevent Fractures', source: 'USPSTF', year: '2025',
    status: 'Current',
    summary: '## Recommendation\nWomen \u226565: screen. (Grade B)\nPostmenopausal women <65 at increased fracture risk (by a clinical risk tool): screen. (Grade B)\nMen: insufficient evidence either way. (I statement)\n## How to screen\nTest: central DXA (hip and spine).\nWomen <65: use a validated risk tool (e.g., FRAX without BMD) to decide who needs a DXA \u2014 do not order routinely for all perimenopausal women.\n## 2025 update\nCore threshold unchanged (age 65), but sharper emphasis on structured risk-tool use rather than informal judgment for younger women.\nMen: still no recommendation \u2014 reflects insufficient evidence, not evidence of no benefit.\n## Practical notes\nA positive screen needs a treatment plan (bisphosphonate or other agent) \u2014 screening alone does not reduce fractures.',
    evidence: 'Grade B (women \u226565 and high-risk postmenopausal women <65); I statement (men)', link: 'https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/osteoporosis-screening', tags: 'USPSTF, osteoporosis, DXA, bone density, fracture prevention', notes: 'First major update in several years \u2014 sharpens the risk-tool requirement for women under 65. The calculator below covers eligibility only; FRAX itself is a proprietary, country-calibrated algorithm, so use the official tool linked below for an actual fracture risk percentage rather than a homemade estimate.' },
  { id: 'g16', specialty: 'Preventive Medicine', subspecialty: 'Vascular screening', topic: 'Abdominal Aortic Aneurysm Screening',
    calculator: 'aaascreen',
    name: 'USPSTF: Screening for Abdominal Aortic Aneurysm', source: 'USPSTF', year: '2019',
    status: 'Current',
    summary: '## Recommendation\nMen 65\u201375, ever smoked: one-time screening ultrasound. (Grade B)\nMen 65\u201375, never smoked: selective, based on other risk factors and preference. (Grade C)\nWomen 65\u201375, ever smoked or family history: insufficient evidence. (I statement)\nWomen, never smoked, no family history: do not screen.\n## Why smoking status is the deciding factor\nSmoking is the strongest modifiable AAA risk factor \u2014 most clinically significant AAAs occur in current or former smokers.\n## Practical notes\nOne-time test, not recurring \u2014 a normal aorta at this age does not need rescreening.\nAAA found: size dictates management \u2014 small means surveillance ultrasound; large or rapidly growing means vascular surgery referral.',
    evidence: 'Grade B (men 65-75, ever smoked); Grade C (men 65-75, never smoked); I statement (women, ever smoked/family history)', link: 'https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/abdominal-aortic-aneurysm-screening', tags: 'USPSTF, AAA, abdominal aortic aneurysm, ultrasound, vascular', notes: 'Easy to forget during a routine visit for a 65-75 year old man with any smoking history.' },
  { id: 'g17', specialty: 'Preventive Medicine', subspecialty: 'Infectious disease screening', topic: 'HIV Screening',
    calculator: '',
    name: 'USPSTF: Screening for HIV Infection', source: 'USPSTF', year: '2019',
    status: 'Current',
    summary: '## Recommendation\nAges 15\u201365: screen at least once. (Grade A)\nOutside this range: screen if increased risk. (Grade A)\nPregnancy: screen everyone, including unknown status in labor. (Grade A)\n## Increased-risk groups (screen outside the default age range)\nMen who have sex with men, people who inject drugs, new or multiple sex partners, exchange sex for money or drugs, or anyone who requests testing or has a partner with HIV or unknown status.\n## Rescreening\nNo fixed interval specified for average-risk adults after the initial screen.\nOngoing risk factors: annual rescreening is reasonable per CDC guidance.\n## Practical notes\nOpt-out testing (not opt-in, written-consent) improves uptake \u2014 endorsed by both CDC and USPSTF.\nConfirm any positive screen before diagnosis \u2014 a single immunoassay is not sufficient.',
    evidence: 'Grade A', link: 'https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/human-immunodeficiency-virus-hiv-infection-screening', tags: 'USPSTF, HIV, screening, infectious disease', notes: 'Consider pairing with PrEP counseling for at-risk patients \u2014 a separate Grade A recommendation covers PrEP.' },
  { id: 'g18', specialty: 'Preventive Medicine', subspecialty: 'Infectious disease screening', topic: 'Hepatitis C Screening',
    calculator: '',
    name: 'USPSTF: Screening for Hepatitis C Virus Infection', source: 'USPSTF', year: '2020',
    status: 'Current',
    summary: '## Recommendation\nAges 18\u201379: screen once. (Grade B)\n## Why universal, not risk-based\nRisk-based screening missed many chronically infected people who did not report or recognize a risk factor (e.g., remote injection drug use, transfusion before 1992).\n## Testing approach\nStep 1: HCV antibody.\nStep 2 (if positive): HCV RNA to confirm active infection \u2014 antibody alone cannot distinguish past cleared infection from current infection.\n## Who needs more than one screen\nOngoing risk (active injection drug use, hemodialysis, HIV): rescreen periodically, any age.\n## Practical notes\nDirect-acting antivirals cure most infections in 8\u201312 weeks \u2014 a positive screen should trigger referral or treatment, not just monitoring.',
    evidence: 'Grade B', link: 'https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/hepatitis-c-screening', tags: 'USPSTF, hepatitis C, HCV, screening, infectious disease', notes: 'A simple one-time universal test, easy to fold into routine bloodwork.' },
  { id: 'g19', specialty: 'Preventive Medicine', subspecialty: 'Cardiovascular prevention', topic: 'Statin and Aspirin Use for Primary Prevention',
    calculator: 'statinaspirin',
    name: 'USPSTF: Statin and Aspirin Use for Primary Prevention of Cardiovascular Disease', source: 'USPSTF', year: '2022',
    status: 'Current',
    summary: '## Statin recommendation\nAges 40\u201375, \u22651 CVD risk factor (dyslipidemia, diabetes, hypertension, smoking), 10-year risk \u226510%: prescribe. (Grade B)\nSame population, risk 7.5\u2013<10%: selectively offer \u2014 individualize. (Grade C)\nAge \u226576: insufficient evidence. (I statement)\nExcludes: LDL-C \u2265190 or known familial hypercholesterolemia \u2014 these patients need statins regardless of calculated risk.\n## Aspirin recommendation (separate 2022 statement)\nAges 40\u201359, 10-year risk \u226510%: individualize \u2014 small net benefit. (Grade C)\nAge \u226560: do not start for primary prevention \u2014 bleeding risk outweighs benefit. (Grade D)\nAlready on aspirin for secondary prevention (known CVD): this does not apply \u2014 do not stop it.\n## Practical notes\nUse PREVENT (not the older Pooled Cohort Equations) to estimate 10-year risk before applying either recommendation.\nRevisit aspirin with any patient \u226560 still taking it for primary prevention \u2014 many were started under older guidance and never reassessed.',
    evidence: 'Grade B (statin, \u226510% risk); Grade C (statin, 7.5-10% risk; aspirin, ages 40-59); Grade D (aspirin, age \u226560)', link: 'https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/statin-use-in-adults-preventive-medication', tags: 'USPSTF, statin, aspirin, primary prevention, cardiovascular risk', notes: 'The aspirin guidance changed substantially in 2022 \u2014 many patients (and clinicians) are still on outdated advice.' },
  { id: 'g20', specialty: 'Preventive Medicine', subspecialty: 'Metabolic screening', topic: 'Prediabetes and Type 2 Diabetes Screening',
    calculator: 'diabetesscreen',
    name: 'USPSTF: Screening for Prediabetes and Type 2 Diabetes', source: 'USPSTF', year: '2021',
    status: 'Current',
    summary: '## Recommendation\nAges 35\u201370, overweight or obese (BMI \u226525, or \u226523 for Asian adults): screen. (Grade B)\nPrediabetes found: offer or refer to a prevention program (intensive lifestyle, or metformin in appropriate candidates).\n## Why age 35, not 40\nLowered in 2021 \u2014 diabetes incidence rises meaningfully at this age, especially with obesity.\nNote: ADA screens even earlier for high-risk groups (family history, high-risk ethnicity, prior gestational diabetes) \u2014 USPSTF and ADA are not fully aligned.\n## Testing options\nFasting glucose, HbA1c, or 2-hour OGTT \u2014 no preferred test.\nCommon practice: repeat every 3 years if normal (not an explicit USPSTF interval).\n## Practical notes\nExcludes pregnant patients and anyone with diabetes symptoms \u2014 they need diagnostic testing, not screening.\nA prediabetes result is actionable \u2014 refer to a CDC-recognized Diabetes Prevention Program when available.',
    evidence: 'Grade B', link: 'https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/screening-for-prediabetes-and-type-2-diabetes', tags: 'USPSTF, diabetes, prediabetes, screening, metabolic', notes: 'ADA criteria are broader than USPSTF (younger age for high-risk groups) \u2014 worth knowing both.' },
  { id: 'g21', specialty: 'Preventive Medicine', subspecialty: 'Mental health', topic: 'Depression and Anxiety Screening',
    calculator: 'phq9gad7',
    name: 'USPSTF: Screening for Depression and Anxiety in Adults', source: 'USPSTF', year: '2023',
    status: 'Current',
    summary: '## Depression recommendation\nAll adults, including \u226565 and pregnant/postpartum: screen for major depressive disorder. (Grade B)\nRequirement: systems must be in place for accurate diagnosis, treatment, and follow-up \u2014 screening alone is not sufficient.\n## Anxiety recommendation (new in 2023)\nAges 19\u201364, including pregnant/postpartum: screen for anxiety disorders. (Grade B)\nAge \u226565: insufficient evidence. (I statement)\nCovers: generalized anxiety, social anxiety, panic disorder, agoraphobia, specific phobias, and related conditions.\n## Suicide risk screening\nInsufficient evidence for universal screening in asymptomatic adults. (I statement)\nThis is a gap, not a reason to skip clinical judgment when risk factors or symptoms are present.\n## Practical notes\nA positive screen starts further evaluation \u2014 it is not a diagnosis by itself.\nUse the calculators below to score an actual PHQ-9 or GAD-7 a patient has completed.',
    evidence: 'Grade B (depression, all adults; anxiety, ages 19-64); I statement (anxiety \u226565; suicide risk screening, all ages)', link: 'https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/anxiety-adults-screening', tags: 'USPSTF, depression, anxiety, mental health, PHQ-9, GAD-7', notes: 'The anxiety screening recommendation is new as of 2023 \u2014 the first time USPSTF has recommended universal anxiety screening in adults.' },
  { id: 'g22', specialty: 'Preventive Medicine', subspecialty: 'Tobacco cessation', topic: 'Tobacco Smoking Cessation',
    calculator: '',
    name: 'USPSTF: Interventions for Tobacco Smoking Cessation in Adults, Including Pregnant Persons', source: 'USPSTF', year: '2021',
    status: 'Current',
    summary: '## Recommendation\nNonpregnant adults who use tobacco: ask, advise to quit, and offer behavioral interventions plus FDA-approved pharmacotherapy. (Grade A)\nPregnant persons who use tobacco: ask, advise to quit, and offer behavioral interventions. (Grade A)\nPharmacotherapy in pregnancy: insufficient evidence to assess benefit vs harm. (I statement)\nE-cigarettes for cessation, any patient: insufficient evidence. (I statement) \u2014 direct patients to interventions with proven effectiveness instead.\n## Effective interventions\nBehavioral: physician or nurse advice (effective even as a single brief visit), individual or group counseling, telephone counseling (quitlines), and mobile phone-based interventions.\nMost effective approach: combine behavioral counseling (4+ sessions) with pharmacotherapy \u2014 typical total contact time across sessions is 90\u2013300 minutes.\nSimple framework: Ask about tobacco use at every visit, Advise to quit, Assess readiness, Assist with counseling/medication, Arrange follow-up (the \u201c5 A\u2019s\u201d).\n## Pharmacotherapy options (nonpregnant adults)\nNicotine replacement therapy (NRT): patch, gum, lozenge, inhaler, or nasal spray \u2014 combining a long-acting patch with a short-acting form outperforms either alone.\nVarenicline: often the most effective single agent; start about 1 week before the target quit date.\nBupropion SR: a reasonable alternative, particularly if coexisting depression or weight-gain concerns are a factor.\nCombination therapy (varenicline + NRT, or bupropion + NRT): reasonable for patients who fail monotherapy.\n## Practical notes\nRelapse is common \u2014 repeat the Ask-Advise-Assist cycle at every visit rather than treating one failed attempt as a stopping point.\nPairs naturally with the Lung Cancer Screening and COPD guidelines \u2014 reinforce cessation counseling at those visits regardless of screening eligibility or COPD severity.',
    evidence: 'Grade A (behavioral + pharmacotherapy, nonpregnant adults; behavioral, pregnant persons); I statement (pharmacotherapy in pregnancy; e-cigarettes for cessation)', link: 'https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/tobacco-use-in-adults-and-pregnant-women-counseling-and-interventions', tags: 'USPSTF, smoking cessation, tobacco, nicotine, varenicline, bupropion', notes: 'Pairs with the Lung Cancer Screening and COPD guidelines above \u2014 cessation counseling belongs at every visit, not just when screening comes up.' },
  { id: 'g23', specialty: 'Cardiology', subspecialty: 'Chest pain / ACS', topic: 'Chest Pain Evaluation',
    calculator: 'heart',
    name: '2021 AHA/ACC/ASE/CHEST/SAEM/SCCT/SCMR Guideline for the Evaluation and Diagnosis of Chest Pain', source: 'AHA/ACC (+5 societies)', year: '2021',
    status: 'Current',
    summary: '## Recommendation\nHigh-sensitivity troponin: preferred over standard troponin \u2014 allows earlier rule-out, as fast as 1\u20133 hours with a validated protocol. (Class I)\nRisk stratification: use a validated tool (HEART score, below) to guide disposition rather than gestalt alone. (Class I)\nLow-risk patients (HEART 0\u20133) with a normal ECG and troponin: consider discharge without further testing, especially within a validated accelerated diagnostic protocol.\n## Using the HEART score\nFive categories, scored 0\u20132 each: History, ECG, Age, Risk factors, Troponin (see calculator below).\n0\u20133 (low risk): roughly 1\u20132% 6-week major adverse cardiac event (MACE) risk \u2014 consider early discharge.\n4\u20136 (moderate risk): roughly 12\u201317% MACE risk \u2014 admission or observation, further testing (stress testing or CT coronary angiography).\n7\u201310 (high risk): roughly 50\u201365% MACE risk \u2014 early invasive strategy, cardiology involvement.\n## Testing pathways\nStable patients with low-to-intermediate pretest probability: coronary CT angiography is a reasonable first-line test \u2014 high negative predictive value.\nKnown coronary disease or high pretest probability: functional stress testing or direct invasive angiography, depending on risk.\n## Practical notes\nSerial troponins matter more than a single value \u2014 a rising or falling pattern helps distinguish acute MI from chronic elevation (e.g., CKD).\nNon-cardiac causes of chest pain (aortic dissection, PE, esophageal, musculoskeletal) stay on the differential \u2014 HEART score is validated for suspected ACS, not as a universal chest pain rule-out.',
    evidence: 'Class I (troponin strategy, risk stratification); the HEART score itself is a validated clinical decision tool, not a formal guideline-graded recommendation', link: 'https://www.jacc.org/doi/10.1016/j.jacc.2021.07.052', tags: 'chest pain, HEART score, ACS, troponin, coronary', notes: 'The HEART score (Six et al., 2008) is a separate validated instrument from this guideline, though the guideline supports risk-stratified pathways generally.' },
  { id: 'g24', specialty: 'Cardiology', subspecialty: 'Anticoagulation', topic: 'Bleeding Risk on Anticoagulation',
    calculator: 'hasbled',
    name: 'HAS-BLED: Bleeding Risk Assessment on Anticoagulation', source: 'Pisters et al., Chest (referenced in ESC/AHA AFib guidelines)', year: '2010',
    status: 'Current',
    summary: '## Purpose\nEstimates 1-year major bleeding risk in patients on anticoagulation (originally validated in atrial fibrillation) \u2014 meant to flag modifiable risk factors, not to exclude anticoagulation outright.\n## Components (1 point each unless noted)\nHypertension: uncontrolled, systolic BP >160 mmHg.\nAbnormal renal function: dialysis, transplant, or creatinine \u22652.26 mg/dL.\nAbnormal liver function: cirrhosis, bilirubin >2x normal, or AST/ALT/ALP >3x normal.\nStroke: prior history.\nBleeding: prior major bleed or a bleeding predisposition (e.g., anemia).\nLabile INR: unstable or high INR, or time in therapeutic range <60%.\nElderly: age >65.\nDrugs: concurrent antiplatelet or NSAID use.\nAlcohol: \u22658 drinks per week.\n## Interpretation\nScore \u22653: high risk of bleeding \u2014 prompts closer monitoring and correction of modifiable factors, not automatic withholding of anticoagulation.\nModifiable factors worth addressing first: labile INR (consider switching to a DOAC), concurrent NSAID/antiplatelet use, uncontrolled blood pressure, alcohol use.\n## Practical notes\nUse alongside a stroke-risk tool (e.g., CHA\u2082DS\u2082-VASc), not instead of one \u2014 a high bleeding-risk score rarely outweighs a high stroke-risk score on its own.\nRepeat periodically \u2014 renal function, blood pressure control, and medication lists all change over time.',
    evidence: 'Validated clinical prediction tool, not a formal society guideline grade', link: 'https://pubmed.ncbi.nlm.nih.gov/20299623/', tags: 'HAS-BLED, bleeding risk, anticoagulation, atrial fibrillation', notes: 'Pairs naturally with the CHA\u2082DS\u2082-VASc calculator on the Atrial Fibrillation guideline \u2014 most clinicians check both before starting anticoagulation.' },
  { id: 'g25', specialty: 'Gastroenterology', subspecialty: 'GI bleeding', topic: 'Upper GI Bleeding',
    calculator: 'gbs',
    name: 'ACG Clinical Guideline: Upper Gastrointestinal and Ulcer Bleeding', source: 'ACG', year: '2021',
    status: 'Current',
    summary: '## Initial resuscitation\nHemodynamic resuscitation before endoscopy: IV access, crystalloid, and transfusion as needed take priority over urgent endoscopy in unstable patients.\nRestrictive transfusion strategy: transfuse for hemoglobin <7 g/dL in most patients (threshold may be higher with active bleeding, cardiovascular disease, or hemodynamic instability).\n## Risk stratification\nGlasgow-Blatchford Score (calculator below): estimates need for intervention \u2014 transfusion, endoscopy, surgery \u2014 using labs and vitals available before endoscopy.\nScore of 0: very low risk \u2014 may be appropriate for outpatient management without admission or urgent endoscopy in select patients.\nAny point above 0: warrants admission and endoscopic evaluation.\n## Medical therapy\nPPI therapy: start before endoscopy in suspected upper GI bleeding \u2014 reduces high-risk endoscopic stigmata, though does not clearly change mortality or transfusion needs.\nSuspected variceal bleeding: add a vasoactive agent (octreotide) and antibiotics (e.g., ceftriaxone) at presentation, before endoscopy.\n## Endoscopy timing\nNon-variceal bleeding: endoscopy within 24 hours of presentation for most patients.\nHemodynamically unstable, high-risk bleeding: consider endoscopy within 12 hours after resuscitation.\n## Post-endoscopy management\nHigh-risk stigmata treated endoscopically: continue high-dose IV PPI for 72 hours, then transition to oral therapy.\nLow-risk findings (clean-based ulcer): early discharge and oral PPI is reasonable.',
    evidence: 'Conditional and strong recommendations (GRADE), mixed', link: 'https://journals.lww.com/ajg/pages/default.aspx', tags: 'GI bleed, Glasgow-Blatchford, upper GI bleeding, PPI, endoscopy', notes: 'The Glasgow-Blatchford Score uses labs and vitals only (no endoscopy needed) \u2014 useful for triage before a scope is even performed.' },
  { id: 'g26', specialty: 'Psychiatry', subspecialty: 'Alcohol withdrawal', topic: 'Alcohol Withdrawal Assessment',
    calculator: 'ciwa',
    name: 'CIWA-Ar: Clinical Institute Withdrawal Assessment for Alcohol', source: 'Sullivan et al., widely adopted inpatient protocol', year: '1989',
    status: 'Current',
    summary: '## Purpose\nA 10-item bedside scale used to grade alcohol withdrawal severity and guide symptom-triggered treatment, rather than dosing on a fixed schedule regardless of symptoms.\n## Scoring\nNine items scored 0\u20137 (nausea/vomiting, tremor, sweats, anxiety, agitation, tactile disturbances, auditory disturbances, visual disturbances, headache) plus one item (orientation and clouding of sensorium) scored 0\u20134 \u2014 total possible 0\u201367.\n## Interpretation and general approach\nScore <8\u201310: minimal withdrawal \u2014 medication often not needed, continue monitoring.\nScore 8\u201315: mild-to-moderate withdrawal \u2014 symptom-triggered benzodiazepine dosing is reasonable.\nScore >15: severe withdrawal \u2014 higher risk of seizures and delirium tremens; more aggressive treatment and closer monitoring, including consideration of a higher level of care, are warranted.\n## Practical notes\nSymptom-triggered dosing (reassess and redose based on the score) generally uses less total medication and shortens treatment duration compared with fixed-schedule dosing.\nRelies on patient self-report for several items \u2014 use cautiously in patients who cannot reliably communicate (intubated, significant cognitive impairment, other sedating conditions); consider an objective scale instead in those cases.\nThiamine before glucose: give thiamine before or with any dextrose-containing fluids in patients with concern for alcohol use disorder, to reduce the risk of precipitating Wernicke encephalopathy.',
    evidence: 'Widely adopted validated scale, not a formal society guideline grade', link: 'https://pubmed.ncbi.nlm.nih.gov/2597811/', tags: 'CIWA-Ar, alcohol withdrawal, benzodiazepine, delirium tremens', notes: 'One of the most frequently used scoring tools on a general medicine ward.' },
  { id: 'g27', specialty: 'Critical Care', subspecialty: 'VTE prophylaxis', topic: 'VTE Risk in Hospitalized Medical Patients',
    calculator: 'padua',
    name: 'Padua Prediction Score: VTE Risk in Hospitalized Medical Patients', source: 'Barbar et al.; referenced in ACCP/CHEST guidance', year: '2010',
    status: 'Current',
    summary: '## Purpose\nEstimates VTE risk in hospitalized, non-surgical medical patients to decide who needs pharmacologic prophylaxis versus mechanical measures alone.\n## Components and points\nActive cancer: 3.\nPrevious VTE (excluding superficial vein thrombosis): 3.\nReduced mobility (bedrest with bathroom privileges expected \u22653 days): 3.\nKnown thrombophilic condition: 3.\nRecent (\u22641 month) trauma or surgery: 2.\nAge \u226570: 1.\nHeart and/or respiratory failure: 1.\nAcute MI or ischemic stroke: 1.\nAcute infection and/or rheumatologic disorder: 1.\nObesity (BMI \u226530): 1.\nOngoing hormonal treatment: 1.\n## Interpretation\nScore \u22654: high risk \u2014 pharmacologic prophylaxis (e.g., LMWH, unfractionated heparin, or a DOAC where appropriate) is recommended absent a contraindication.\nScore <4: low risk \u2014 pharmacologic prophylaxis is not routinely needed; early mobilization and mechanical prophylaxis (e.g., intermittent pneumatic compression) are reasonable.\n## Practical notes\nReassess if the clinical picture changes during admission (e.g., new immobility, new infection) \u2014 the score reflects risk at a point in time, not for the whole stay automatically.\nAlways weigh bleeding risk before starting pharmacologic prophylaxis \u2014 a parallel bleeding-risk assessment is a reasonable companion, though not built into this tool.',
    evidence: 'Validated clinical prediction tool, not a formal society guideline grade', link: 'https://pubmed.ncbi.nlm.nih.gov/20738765/', tags: 'Padua score, VTE prophylaxis, DVT, PE, hospitalized patients', notes: 'Complements the Acute Pulmonary Embolism guideline above \u2014 this tool is about preventing a first VTE, not diagnosing one already suspected.' },
  { id: 'g28', specialty: 'Gastroenterology', subspecialty: 'Hepatology / liver transplant', topic: 'MELD-Na Liver Disease Severity',
    calculator: 'meldna',
    name: 'MELD-Na: Model for End-Stage Liver Disease with Sodium', source: 'OPTN/UNOS Policy (2016 update); Kim et al., NEJM', year: '2016',
    status: 'Current',
    summary: '## Purpose\nEstimates 90-day mortality in patients with cirrhosis and is the primary score UNOS/OPTN uses to prioritize candidates for deceased-donor liver transplantation.\n## Formula (the calculator below does this automatically)\nInitial MELD = 0.957 \u00d7 ln(creatinine) + 0.378 \u00d7 ln(bilirubin) + 1.120 \u00d7 ln(INR) + 0.643, then rounded to the nearest tenth and multiplied by 10.\nFloors: creatinine, bilirubin, and INR are each set to a minimum of 1.0 if measured lower.\nCreatinine cap: set to 4.0 mg/dL if the measured value is higher, or if the patient has had 2 or more dialysis sessions (or 24 hours of continuous veno-venous hemodialysis) in the past week.\nSodium adjustment (MELD-Na): applied only if the initial MELD is greater than 11 \u2014 adds a correction based on serum sodium, bounded between 125 and 137 mEq/L.\nFinal score is capped at 40.\n## Interpretation (approximate 3-month mortality)\nScore <10: mortality risk is low \u2014 outpatient management and routine hepatology follow-up.\nScore 10\u201319: moderate risk \u2014 consider referral to a hepatologist or transplant center.\nScore 20\u201329: mortality risk climbs substantially \u2014 active transplant evaluation is appropriate.\nScore \u226530: very high mortality risk \u2014 urgent transplant evaluation.\n## Practical notes\nUse the most recent, clinically stable labs \u2014 values drawn during an acute reversible illness (e.g., an infection causing a transient creatinine bump) can overestimate baseline severity.\nReassessed periodically for patients on the transplant waitlist, since it directly affects allocation priority as it changes.\nThis calculator is for adults \u2014 a separate pediatric model (PELD) is used for candidates under 12.',
    evidence: 'OPTN/UNOS allocation policy since January 2016', link: 'https://optn.transplant.hrsa.gov/professionals/by-topic/policy-notices/', tags: 'MELD-Na, liver transplant, cirrhosis, UNOS, hepatology', notes: 'Real UNOS allocation math, verified against the exact published OPTN policy formula, floors, and caps \u2014 not an approximation.' }
];

let guidelines = [];
let profile = null;
let adminEmail = null;
let favorites = [];
let viewCounts = {};
let darkMode = false;
let accentColor = 'lavender';
let recentlyViewed = [];
let expandedCalculators = new Set();
let view = { screen: 'home', specialty: null, guidelineId: null, mode: 'browse' };
let searchQuery = '';
let editingGuideline = null;

// ── DEV TOGGLE ──────────────────────────────────────────────────────────
// Set to false (or delete this block) to restore the normal sign-in screen.
// While true, skips signup and auto-logs in as a test profile so you don't
// have to click through the welcome screen on every reload.
const DEV_SKIP_SIGNIN = false;
const DEV_PROFILE = { name: 'Test User', email: 'test@dev.local', joinedAt: new Date().toISOString() };
// ─────────────────────────────────────────────────────────────────────────

const root = document.getElementById('root');

function initials(name) {
  return (name || '').trim().split(/\s+/).map(p => p[0]).slice(0,2).join('').toUpperCase() || '?';
}

async function loadProfile() {
  try {
    const result = await window.storage.get(PROFILE_KEY, false);
    profile = JSON.parse(result.value);
  } catch (e) {
    profile = null;
  }
  if (!profile && DEV_SKIP_SIGNIN) {
    profile = DEV_PROFILE;
  }
}

async function loadAdmin() {
  try {
    const result = await window.storage.get(ADMIN_KEY, true);
    adminEmail = JSON.parse(result.value);
  } catch (e) {
    adminEmail = null;
  }
}

function isAdmin() {
  return !!(profile && adminEmail && profile.email.trim().toLowerCase() === adminEmail.trim().toLowerCase());
}

async function loadFavorites() {
  try {
    const result = await window.storage.get(FAVORITES_KEY, false);
    favorites = JSON.parse(result.value);
  } catch (e) {
    favorites = [];
  }
}

async function loadRecentlyViewed() {
  try {
    const result = await window.storage.get(RECENT_KEY, false);
    recentlyViewed = JSON.parse(result.value);
  } catch (e) {
    recentlyViewed = [];
  }
}

async function trackRecentlyViewed(id) {
  recentlyViewed = [id, ...recentlyViewed.filter(r => r !== id)].slice(0, 3);
  try { await window.storage.set(RECENT_KEY, JSON.stringify(recentlyViewed), false); }
  catch (e) { console.error('Could not save recently viewed', e); }
}

async function loadDarkMode() {
  try {
    const result = await window.storage.get(DARK_MODE_KEY, false);
    darkMode = JSON.parse(result.value) === true;
  } catch (e) {
    darkMode = false;
  }
  applyTheme();
}

const ACCENTS = {
  lavender: { light: { primary: '#8B85B8', dark: '#6B6494', deep: '#A9D8C9' }, dark: { primary: '#A79EDB', dark: '#C7BFF0', deep: '#7FC4AE' } },
  ocean:    { light: { primary: '#6B93C9', dark: '#4E729E', deep: '#7FC4C0' }, dark: { primary: '#8FB4E8', dark: '#B8D3FF', deep: '#6FD4CC' } },
  coral:    { light: { primary: '#D98B7A', dark: '#B96A58', deep: '#E3B98C' }, dark: { primary: '#F0A896', dark: '#FFC9B8', deep: '#F0CE9E' } },
  sage:     { light: { primary: '#7FA88B', dark: '#5E8468', deep: '#A9C9D8' }, dark: { primary: '#9EC9AC', dark: '#C0E8CE', deep: '#B8DCE8' } },
  rose:     { light: { primary: '#C97FA0', dark: '#A85C80', deep: '#D8B4A9' }, dark: { primary: '#E8A0BE', dark: '#F5C4DA', deep: '#E8C8BE' } },
};

async function loadAccentColor() {
  try {
    const result = await window.storage.get(ACCENT_KEY, false);
    const val = JSON.parse(result.value);
    accentColor = ACCENTS[val] ? val : 'lavender';
  } catch (e) {
    accentColor = 'lavender';
  }
}

async function setAccentColor(key) {
  if (!ACCENTS[key]) return;
  accentColor = key;
  applyTheme();
  try { await window.storage.set(ACCENT_KEY, JSON.stringify(accentColor), false); }
  catch (e) { console.error('Could not save accent color', e); }
  render();
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
  const palette = (ACCENTS[accentColor] || ACCENTS.lavender)[darkMode ? 'dark' : 'light'];
  document.documentElement.style.setProperty('--primary', palette.primary);
  document.documentElement.style.setProperty('--primary-dark', palette.dark);
  document.documentElement.style.setProperty('--primary-deep', palette.deep);
}

async function toggleDarkMode() {
  darkMode = !darkMode;
  applyTheme();
  try { await window.storage.set(DARK_MODE_KEY, JSON.stringify(darkMode), false); }
  catch (e) { console.error('Could not save theme preference', e); }
  render();
}

function isFavorite(id) {
  return favorites.includes(id);
}

async function toggleFavorite(id, event) {
  if (event) event.stopPropagation();
  favorites = isFavorite(id) ? favorites.filter(f => f !== id) : [...favorites, id];
  try { await window.storage.set(FAVORITES_KEY, JSON.stringify(favorites), false); }
  catch (e) { console.error('Could not save favorites', e); }
  render();
}

async function loadViewCounts() {
  try {
    const result = await window.storage.get(VIEW_COUNTS_KEY, true);
    viewCounts = JSON.parse(result.value);
  } catch (e) {
    viewCounts = {};
  }
}

async function incrementViewCount(id) {
  viewCounts[id] = (viewCounts[id] || 0) + 1;
  try { await window.storage.set(VIEW_COUNTS_KEY, JSON.stringify(viewCounts), true); }
  catch (e) { console.error('Could not save view count', e); }
}

async function loadData() {
  await loadAccentColor();
  await loadDarkMode();
  await loadProfile();
  await loadAdmin();
  await loadFavorites();
  await loadRecentlyViewed();
  await loadViewCounts();
  // The very first person to sign in automatically becomes the admin (Manage access + reset button).
  // This is a lightweight convenience gate, not real authentication — anyone with storage access
  // to this artifact could still see the shared data, so don't put anything sensitive in here.
  if (profile && !adminEmail) {
    adminEmail = profile.email;
    try { await window.storage.set(ADMIN_KEY, JSON.stringify(adminEmail), true); }
    catch (e) { console.error('Could not set admin', e); }
  }
  try {
    const result = await window.storage.get(STORAGE_KEY, SHARED);
    guidelines = JSON.parse(result.value);
  } catch (e) {
    guidelines = SEED_DATA;
    try { await window.storage.set(STORAGE_KEY, JSON.stringify(guidelines), SHARED); }
    catch (err) { console.error('Could not seed storage', err); }
  }
  render();
}

async function saveData() {
  try { await window.storage.set(STORAGE_KEY, JSON.stringify(guidelines), SHARED); }
  catch (e) { console.error('Save failed', e); alert('Could not save changes. Please try again.'); }
}

async function resetToSeedData() {
  if (!confirm('This replaces ALL current guidelines (shared with everyone using this app) with the latest sample data. Any custom entries you\'ve added will be lost. Continue?')) return;
  guidelines = JSON.parse(JSON.stringify(SEED_DATA));
  await saveData();
  render();
}

async function submitSignup() {
  const name = document.getElementById('su-name').value.trim();
  const email = document.getElementById('su-email').value.trim();
  if (!name || !email) { alert('Please enter your name and email.'); return; }
  profile = { name, email, joinedAt: new Date().toISOString() };
  try { await window.storage.set(PROFILE_KEY, JSON.stringify(profile), false); }
  catch (e) { console.error('Could not save profile', e); }
  if (!adminEmail) {
    adminEmail = profile.email;
    try { await window.storage.set(ADMIN_KEY, JSON.stringify(adminEmail), true); }
    catch (e) { console.error('Could not set admin', e); }
  }
  view = { screen: 'home', specialty: null, guidelineId: null, mode: 'browse' };
  render();
}

function switchUser() {
  if (!confirm('Sign out and clear your saved name/email on this device?')) return;
  window.storage.delete(PROFILE_KEY, false).catch(()=>{});
  profile = null;
  render();
}

function goTo(screen, extra = {}) {
  view = { ...view, screen, ...extra };
  if (screen === 'detail' && extra.guidelineId) { incrementViewCount(extra.guidelineId); trackRecentlyViewed(extra.guidelineId); }
  render();
}
function setMode(mode) {
  if (mode === 'manage' && !isAdmin()) return;
  const screenByMode = { browse: 'home', manage: 'manageList', calculators: 'calculators' };
  view = { screen: screenByMode[mode] || 'home', specialty: null, guidelineId: null, mode };
  render();
}

function specialtiesList() {
  const map = {};
  guidelines.forEach(g => {
    if (!map[g.specialty]) map[g.specialty] = { total: 0, review: 0 };
    map[g.specialty].total++;
    if (g.status === 'Needs Review') map[g.specialty].review++;
  });
  return Object.entries(map).sort((a,b) => a[0].localeCompare(b[0]));
}
function guidelinesFor(specialty) { return guidelines.filter(g => g.specialty === specialty); }
function groupBySubspecialty(list) {
  const map = {};
  list.forEach(g => { const key = g.subspecialty || 'General'; if (!map[key]) map[key] = []; map[key].push(g); });
  return map;
}
function statusTag(status) {
  if (status === 'Current') return `<span class="tag tag-current">Current</span>`;
  if (status === 'Needs Review') return `<span class="tag tag-review">Needs review</span>`;
  return `<span class="tag tag-neutral">${escapeHtml(status || '')}</span>`;
}
function escapeHtml(str) { const d = document.createElement('div'); d.innerText = str == null ? '' : str; return d.innerHTML; }
function searchResults(query) {
  const q = query.toLowerCase();
  return guidelines.filter(g =>
    (g.name||'').toLowerCase().includes(q) || (g.topic||'').toLowerCase().includes(q) ||
    (g.specialty||'').toLowerCase().includes(q) || (g.tags||'').toLowerCase().includes(q) ||
    (g.source||'').toLowerCase().includes(q)
  );
}

    .map(cat => `
