function updateBP(calcId) {
  const sbp = parseFloat(document.getElementById(`${calcId}-sbp`).value);
  const dbp = parseFloat(document.getElementById(`${calcId}-dbp`).value);
  const resultEl = document.getElementById(`result-${calcId}`);
  if (!resultEl) return;
  if (isNaN(sbp) || isNaN(dbp)) { resultEl.innerHTML = 'Enter both values to see the category.'; return; }
  let category, cls;
  if (sbp >= 180 || dbp >= 120) { category = 'Hypertensive crisis — evaluate for end-organ damage immediately.'; cls = 'calc-high'; }
  else if (sbp >= 140 || dbp >= 90) { category = 'Stage 2 hypertension.'; cls = 'calc-high'; }
  else if (sbp >= 130 || dbp >= 80) { category = 'Stage 1 hypertension.'; cls = 'calc-mid'; }
  else if (sbp >= 120) { category = 'Elevated blood pressure.'; cls = 'calc-mid'; }
  else { category = 'Normal blood pressure.'; cls = 'calc-low'; }
  resultEl.innerHTML = `<span class="calc-score">${sbp}/${dbp} mmHg</span><span class="${cls}">${category}</span>`;
}

function updateScreenCalc(calcId, kind) {
  const resultEl = document.getElementById(`result-${calcId}`);
  if (!resultEl) return;
  const num = (id) => parseFloat((document.getElementById(id) || {}).value);
  const radioVal = (role) => {
    const el = document.querySelector(`[data-role="${role}"][name$="-${calcId}"]:checked`);
    return el ? el.value : null;
  };

  if (kind === 'cervical') {
    const age = num(`${calcId}-age`);
    const hyst = document.getElementById(`${calcId}-hyst`).checked;
    if (hyst) { resultEl.innerHTML = '<span class="calc-low">No further screening needed \u2014 hysterectomy with cervix removed for benign disease. (against screening)</span>'; return; }
    if (isNaN(age)) { resultEl.innerHTML = 'Enter age to see the recommendation.'; return; }
    if (age < 21) resultEl.innerHTML = '<span class="calc-low">Not recommended before age 21.</span>';
    else if (age <= 29) resultEl.innerHTML = '<span class="calc-mid">Cytology (Pap test) alone every 3 years. (Grade A)</span>';
    else if (age <= 65) resultEl.innerHTML = '<span class="calc-mid">Choose one: cytology alone q3y, hrHPV alone q5y, or co-testing q5y. (Grade A)</span>';
    else resultEl.innerHTML = '<span class="calc-low">Not recommended if prior screening was adequate and normal \u2014 confirm screening history before stopping. (Grade D)</span>';
    return;
  }

  if (kind === 'crc') {
    const age = num(`${calcId}-age`);
    if (isNaN(age)) { resultEl.innerHTML = 'Enter age to see the recommendation.'; return; }
    if (age < 45) resultEl.innerHTML = '<span class="calc-low">Not yet indicated by average-risk criteria \u2014 check for personal/family risk factors that may warrant earlier screening.</span>';
    else if (age <= 49) resultEl.innerHTML = '<span class="calc-mid">Screen. (Grade B)</span>';
    else if (age <= 75) resultEl.innerHTML = '<span class="calc-high">Screen. (Grade A)</span>';
    else if (age <= 85) resultEl.innerHTML = '<span class="calc-mid">Selective \u2014 based on health, prior screening, and preference. (Grade C)</span>';
    else resultEl.innerHTML = '<span class="calc-low">Not routinely recommended after 85.</span>';
    return;
  }

  if (kind === 'lung') {
    const age = num(`${calcId}-age`);
    const packyears = num(`${calcId}-packyears`);
    const quit = radioVal('quit');
    if (isNaN(age) || isNaN(packyears) || !quit) { resultEl.innerHTML = 'Enter age and pack-years, then select smoking status.'; return; }
    const ageOk = age >= 50 && age <= 80;
    const packOk = packyears >= 20;
    const smokeOk = quit === 'current' || quit === 'recent';
    if (ageOk && packOk && smokeOk) resultEl.innerHTML = '<span class="calc-high">Eligible \u2014 annual low-dose CT recommended. (Grade B)</span>';
    else {
      const reasons = [];
      if (!ageOk) reasons.push('age outside 50\u201380');
      if (!packOk) reasons.push('<20 pack-years');
      if (!smokeOk) reasons.push('quit >15 years ago or never smoked');
      resultEl.innerHTML = `<span class="calc-low">Not eligible under USPSTF criteria (${reasons.join(', ')}).</span>`;
    }
    return;
  }

  if (kind === 'osteo') {
    const sex = radioVal('sex') || 'female';
    const age = num(`${calcId}-age`);
    const postmeno = document.getElementById(`${calcId}-postmeno`).checked;
    const riskfactor = document.getElementById(`${calcId}-riskfactor`).checked;
    if (sex === 'male') { resultEl.innerHTML = '<span class="calc-mid">Insufficient evidence to screen men. (I statement) \u2014 consider individual risk factors and shared decision-making.</span>'; return; }
    if (isNaN(age)) { resultEl.innerHTML = 'Enter age to see the recommendation.'; return; }
    if (age >= 65) resultEl.innerHTML = '<span class="calc-high">Screen. (Grade B)</span>';
    else if (postmeno && riskfactor) resultEl.innerHTML = '<span class="calc-high">Screen \u2014 postmenopausal with increased fracture risk. (Grade B)</span>';
    else resultEl.innerHTML = '<span class="calc-low">Not yet indicated by USPSTF criteria \u2014 reassess at 65 or if fracture risk factors emerge.</span>';
    return;
  }

  if (kind === 'aaa') {
    const sex = radioVal('sex') || 'male';
    const age = num(`${calcId}-age`);
    const smoke = radioVal('smoke') || 'ever';
    if (isNaN(age)) { resultEl.innerHTML = 'Enter age to see the recommendation.'; return; }
    const inRange = age >= 65 && age <= 75;
    if (!inRange) { resultEl.innerHTML = '<span class="calc-low">Outside the 65\u201375 age range this recommendation addresses.</span>'; return; }
    if (sex === 'male') {
      resultEl.innerHTML = smoke === 'ever'
        ? '<span class="calc-high">One-time screening ultrasound recommended. (Grade B)</span>'
        : '<span class="calc-mid">Selective \u2014 based on other risk factors and preference. (Grade C)</span>';
    } else {
      resultEl.innerHTML = smoke === 'ever'
        ? '<span class="calc-mid">Insufficient evidence to recommend for or against. (I statement)</span>'
        : '<span class="calc-low">Do not screen.</span>';
    }
    return;
  }

  if (kind === 'statinaspirin') {
    const age = num(`${calcId}-age`);
    const risk = num(`${calcId}-risk`);
    const rfCount = document.querySelectorAll(`[data-role="rf"]:checked`).length;
    if (isNaN(age) || isNaN(risk)) { resultEl.innerHTML = 'Enter age, risk %, and any risk factors.'; return; }
    let statinMsg;
    if (age < 40 || age > 75) statinMsg = 'Statin: age outside 40\u201375 \u2014 insufficient evidence via this pathway. (I statement)';
    else if (rfCount === 0) statinMsg = 'Statin: no listed CVD risk factor \u2014 this pathway does not apply.';
    else if (risk >= 10) statinMsg = 'Statin: recommended. (Grade B)';
    else if (risk >= 7.5) statinMsg = 'Statin: selectively offer \u2014 individualize. (Grade C)';
    else statinMsg = 'Statin: not indicated by this pathway (risk <7.5%).';
    let aspirinMsg;
    if (age < 40) aspirinMsg = 'Aspirin: not addressed by this recommendation below age 40.';
    else if (age <= 59) aspirinMsg = risk >= 10 ? 'Aspirin: individualize \u2014 small net benefit. (Grade C)' : 'Aspirin: not indicated (risk <10%).';
    else aspirinMsg = 'Aspirin: do not start for primary prevention. (Grade D)';
    resultEl.innerHTML = `<span class="calc-score">${statinMsg}</span><span class="calc-score">${aspirinMsg}</span>`;
    return;
  }

  if (kind === 'diabetes') {
    const age = num(`${calcId}-age`);
    const height = num(`${calcId}-height`);
    const weight = num(`${calcId}-weight`);
    const asian = document.getElementById(`${calcId}-asian`).checked;
    if (isNaN(age) || isNaN(height) || isNaN(weight) || height <= 0) { resultEl.innerHTML = 'Enter age, height, and weight.'; return; }
    const bmi = weight / Math.pow(height / 100, 2);
    const threshold = asian ? 23 : 25;
    const bmiLabel = `BMI: ${bmi.toFixed(1)}`;
    if (age < 35 || age > 70) resultEl.innerHTML = `<span class="calc-score">${bmiLabel}</span><span class="calc-mid">Age outside 35\u201370 \u2014 this pathway does not apply (ADA screens earlier for some high-risk groups).</span>`;
    else if (bmi >= threshold) resultEl.innerHTML = `<span class="calc-score">${bmiLabel}</span><span class="calc-high">Eligible \u2014 screen for prediabetes/T2DM. (Grade B)</span>`;
    else resultEl.innerHTML = `<span class="calc-score">${bmiLabel}</span><span class="calc-low">Below the BMI threshold \u2014 not indicated by this pathway.</span>`;
    return;
  }

  if (kind === 'gbs') {
    const sex = radioVal('sex') || 'male';
    const bun = num(`${calcId}-bun`);
    const hgb = num(`${calcId}-hgb`);
    const sbp = num(`${calcId}-sbp`);
    if (isNaN(bun) || isNaN(hgb) || isNaN(sbp)) { resultEl.innerHTML = 'Enter BUN, hemoglobin, and systolic BP.'; return; }
    let points = 0;
    if (bun >= 70) points += 6;
    else if (bun >= 28) points += 4;
    else if (bun >= 22.4) points += 3;
    else if (bun >= 18.2) points += 2;
    if (sex === 'male') {
      if (hgb < 10) points += 6;
      else if (hgb < 12) points += 3;
      else if (hgb < 13) points += 1;
    } else {
      if (hgb < 10) points += 6;
      else if (hgb < 12) points += 1;
    }
    if (sbp < 90) points += 3;
    else if (sbp < 100) points += 2;
    else if (sbp < 110) points += 1;
    if (document.getElementById(`${calcId}-hr`).checked) points += 1;
    if (document.getElementById(`${calcId}-melena`).checked) points += 1;
    if (document.getElementById(`${calcId}-syncope`).checked) points += 2;
    if (document.getElementById(`${calcId}-hepatic`).checked) points += 2;
    if (document.getElementById(`${calcId}-cardiac`).checked) points += 2;
    const cls = points === 0 ? 'calc-low' : 'calc-high';
    const msg = points === 0
      ? 'Very low risk \u2014 may be appropriate for outpatient management without urgent endoscopy.'
      : 'Warrants admission and endoscopic evaluation.';
    resultEl.innerHTML = `<span class="calc-score">Score: ${points}</span><span class="${cls}">${msg}</span>`;
    return;
  }

  if (kind === 'meldna') {
    let cr = num(`${calcId}-cr`);
    let bili = num(`${calcId}-bili`);
    let inr = num(`${calcId}-inr`);
    let na = num(`${calcId}-na`);
    const dialysis = document.getElementById(`${calcId}-dialysis`).checked;
    if (isNaN(cr) || isNaN(bili) || isNaN(inr) || isNaN(na)) { resultEl.innerHTML = 'Enter creatinine, bilirubin, INR, and sodium.'; return; }
    if (cr < 1.0) cr = 1.0;
    if (bili < 1.0) bili = 1.0;
    if (inr < 1.0) inr = 1.0;
    if (dialysis || cr > 4.0) cr = 4.0;
    let meldi = 0.957 * Math.log(cr) + 0.378 * Math.log(bili) + 1.120 * Math.log(inr) + 0.643;
    meldi = Math.round(meldi * 10) / 10 * 10;
    let final = meldi;
    if (meldi > 11) {
      let naBounded = na;
      if (naBounded < 125) naBounded = 125;
      if (naBounded > 137) naBounded = 137;
      final = meldi + 1.32 * (137 - naBounded) - (0.033 * meldi * (137 - naBounded));
    }
    final = Math.round(final);
    if (final > 40) final = 40;
    if (final < 6) final = 6;
    let tier, cls;
    if (final < 10) { tier = 'Low mortality risk \u2014 outpatient management and routine hepatology follow-up.'; cls = 'calc-low'; }
    else if (final < 20) { tier = 'Moderate risk \u2014 consider referral to a hepatologist or transplant center.'; cls = 'calc-mid'; }
    else if (final < 30) { tier = 'Substantial mortality risk \u2014 active transplant evaluation appropriate.'; cls = 'calc-high'; }
    else { tier = 'Very high mortality risk \u2014 urgent transplant evaluation.'; cls = 'calc-high'; }
    resultEl.innerHTML = `<span class="calc-score">MELD-Na: ${final}</span><span class="${cls}">${tier}</span>`;
    return;
  }
}

function updateCIWA(calcId) {
  const ids = Array.from({ length: 10 }, (_, i) => `${calcId}-c-${i}`);
  const resultEl = document.getElementById(`result-${calcId}`);
  if (!resultEl) return;
  const vals = ids.map(id => (document.getElementById(id) || {}).value);
  if (vals.some(v => v === undefined || v === '')) {
    resultEl.innerHTML = 'Select all 10 items to see the score.';
    return;
  }
  const total = vals.reduce((s, v) => s + parseInt(v), 0);
  let tier, cls;
  if (total < 8) { tier = 'Minimal withdrawal \u2014 medication often not needed, continue monitoring.'; cls = 'calc-low'; }
  else if (total <= 15) { tier = 'Mild-to-moderate withdrawal \u2014 symptom-triggered benzodiazepine dosing is reasonable.'; cls = 'calc-mid'; }
  else { tier = 'Severe withdrawal \u2014 higher risk of seizures/DTs; closer monitoring and more aggressive treatment warranted.'; cls = 'calc-high'; }
  resultEl.innerHTML = `<span class="calc-score">CIWA-Ar: ${total}/67</span><span class="${cls}">${tier}</span>`;
}

function updatePHQGAD(calcId) {
  const phqIds = [0,1,2,3,4,5,6,7,8].map(i => `${calcId}-phq-${i}`);
  const gadIds = [0,1,2,3,4,5,6].map(i => `${calcId}-gad-${i}`);
  const phqResultEl = document.getElementById(`result-${calcId}-phq`);
  const gadResultEl = document.getElementById(`result-${calcId}-gad`);
  const phqVals = phqIds.map(id => (document.getElementById(id) || {}).value);
  const gadVals = gadIds.map(id => (document.getElementById(id) || {}).value);

  if (phqResultEl) {
    if (phqVals.some(v => v === undefined || v === '')) {
      phqResultEl.innerHTML = 'Select all 9 items to see the score.';
    } else {
      const total = phqVals.reduce((s, v) => s + parseInt(v), 0);
      let severity, cls;
      if (total <= 4) { severity = 'Minimal depression'; cls = 'calc-low'; }
      else if (total <= 9) { severity = 'Mild depression'; cls = 'calc-low'; }
      else if (total <= 14) { severity = 'Moderate depression'; cls = 'calc-mid'; }
      else if (total <= 19) { severity = 'Moderately severe depression'; cls = 'calc-high'; }
      else { severity = 'Severe depression'; cls = 'calc-high'; }
      const item9Positive = parseInt(phqVals[8]) > 0;
      const safety = item9Positive ? '<br><span class="calc-high">Item 9 positive (thoughts of self-harm) \u2014 assess safety before the visit ends, regardless of total score.</span>' : '';
      phqResultEl.innerHTML = `<span class="calc-score">PHQ-9: ${total}/27</span><span class="${cls}">${severity}</span>${safety}`;
    }
  }
  if (gadResultEl) {
    if (gadVals.some(v => v === undefined || v === '')) {
      gadResultEl.innerHTML = 'Select all 7 items to see the score.';
    } else {
      const total = gadVals.reduce((s, v) => s + parseInt(v), 0);
      let severity, cls;
      if (total <= 4) { severity = 'Minimal anxiety'; cls = 'calc-low'; }
      else if (total <= 9) { severity = 'Mild anxiety'; cls = 'calc-low'; }
      else if (total <= 14) { severity = 'Moderate anxiety'; cls = 'calc-mid'; }
      else { severity = 'Severe anxiety'; cls = 'calc-high'; }
      gadResultEl.innerHTML = `<span class="calc-score">GAD-7: ${total}/21</span><span class="${cls}">${severity}</span>`;
    }
  }
}

function updateCalc(calcId) {
  const els = document.querySelectorAll(`[data-calcid="${calcId}"]`);
  let score = 0;
  let isFemale = false;
  let symptoms = null, exac = null;
  els.forEach(el => {
    if (el.checked) {
      score += parseFloat(el.dataset.points) || 0;
      if (el.dataset.role === 'sex') isFemale = true;
      if (el.dataset.role === 'symptoms') symptoms = el.dataset.val;
      if (el.dataset.role === 'exac') exac = el.dataset.val;
    }
  });
  const resultEl = document.getElementById(`result-${calcId}`);
  if (!resultEl) return;

  if (calcId.startsWith('heart')) {
    let tier, cls;
    if (score <= 3) { tier = 'Low risk \u2014 roughly 1\u20132% 6-week MACE risk. Consider early discharge.'; cls = 'calc-low'; }
    else if (score <= 6) { tier = 'Moderate risk \u2014 roughly 12\u201317% 6-week MACE risk. Admission/observation, further testing.'; cls = 'calc-mid'; }
    else { tier = 'High risk \u2014 roughly 50\u201365% 6-week MACE risk. Early invasive strategy.'; cls = 'calc-high'; }
    resultEl.innerHTML = `<span class="calc-score">Score: ${score}</span><span class="${cls}">${tier}</span>`;
    return;
  }
  if (calcId.startsWith('hasbled')) {
    let tier, cls;
    if (score >= 3) { tier = 'High bleeding risk \u2014 address modifiable factors and monitor closely.'; cls = 'calc-high'; }
    else { tier = 'Lower bleeding risk on this tool.'; cls = 'calc-low'; }
    resultEl.innerHTML = `<span class="calc-score">Score: ${score}</span><span class="${cls}">${tier}</span>`;
    return;
  }
  if (calcId.startsWith('padua')) {
    let tier, cls;
    if (score >= 4) { tier = 'High risk \u2014 pharmacologic VTE prophylaxis recommended absent contraindication.'; cls = 'calc-high'; }
    else { tier = 'Low risk \u2014 pharmacologic prophylaxis not routinely needed; mechanical prophylaxis/early mobilization reasonable.'; cls = 'calc-low'; }
    resultEl.innerHTML = `<span class="calc-score">Score: ${score}</span><span class="${cls}">${tier}</span>`;
    return;
  }
  if (calcId.startsWith('goldabe')) {
    let group, desc, cls;
    if (exac === 'high') { group = 'Group E'; desc = '— high exacerbation risk drives initial therapy regardless of symptoms.'; cls = 'calc-high'; }
    else if (symptoms === 'high') { group = 'Group B'; desc = '— dual bronchodilation (LAMA + LABA) preferred over monotherapy.'; cls = 'calc-mid'; }
    else { group = 'Group A'; desc = '— a single bronchodilator (LAMA or LABA) is reasonable.'; cls = 'calc-low'; }
    resultEl.innerHTML = `<span class="calc-score">${group}</span><span class="${cls}">${desc}</span>`;
    return;
  }

  if (calcId.startsWith('curb65')) {
    let risk, cls;
    if (score <= 1) { risk = 'Low risk — outpatient treatment reasonable.'; cls = 'calc-low'; }
    else if (score === 2) { risk = 'Moderate risk — consider a short inpatient stay.'; cls = 'calc-mid'; }
    else { risk = 'High risk — inpatient management; consider ICU-level care.'; cls = 'calc-high'; }
    resultEl.innerHTML = `<span class="calc-score">Score: ${score}</span><span class="${cls}">${risk}</span>`;
  } else if (calcId.startsWith('chadsvasc')) {
    let risk, cls;
    const recommendAt = isFemale ? 3 : 2;
    const considerAt = isFemale ? 2 : 1;
    if (score >= recommendAt) { risk = 'Anticoagulation generally recommended.'; cls = 'calc-high'; }
    else if (score >= considerAt) { risk = 'Anticoagulation reasonable to consider — individualize.'; cls = 'calc-mid'; }
    else { risk = 'Low risk; anticoagulation generally not needed.'; cls = 'calc-low'; }
    resultEl.innerHTML = `<span class="calc-score">Score: ${score}</span><span class="${cls}">${risk}</span>`;
  } else if (calcId.startsWith('wellspe')) {
    let tier, cls;
    if (score < 2) { tier = 'Low probability (~1–2%).'; cls = 'calc-low'; }
    else if (score <= 6) { tier = 'Moderate probability (~16%).'; cls = 'calc-mid'; }
    else { tier = 'High probability (~41%).'; cls = 'calc-high'; }
    const dichot = score <= 4
      ? 'PE unlikely — D-dimer reasonable to help rule out.'
      : 'PE likely — proceed to CT pulmonary angiography (V/Q scan if contraindicated).';
    resultEl.innerHTML = `<span class="calc-score">Score: ${score}</span><span class="${cls}">${tier}</span><span class="${cls}">${dichot}</span>`;
  } else if (calcId.startsWith('qsofa')) {
    let risk, cls;
    if (score >= 2) { risk = 'Positive screen — associated with higher risk of poor outcome. Check lactate, consider full SOFA, and evaluate for organ dysfunction.'; cls = 'calc-high'; }
    else { risk = 'Negative screen — lower risk on this tool, but does not rule out sepsis if clinical suspicion remains.'; cls = 'calc-low'; }
    resultEl.innerHTML = `<span class="calc-score">Score: ${score}</span><span class="${cls}">${risk}</span>`;
  }
}

function renderKeyPoints(summary) {
  if (!summary || !summary.trim()) return `<div class="detail-text">—</div>`;
  const lines = summary.split('\n').map(p => p.trim()).filter(Boolean);
  if (lines.length <= 1) return `<div class="detail-text">${escapeHtml(summary)}</div>`;

  // Lines starting with "## " become section headers (e.g. "## Diagnosis").
  // Everything else is a numbered point, numbered within its section.
  const sections = [];
  let current = { title: null, points: [] };
  lines.forEach(line => {
    if (line.startsWith('## ')) {
      if (current.points.length || current.title) sections.push(current);
      current = { title: line.slice(3).trim(), points: [] };
    } else {
      current.points.push(line);
    }
  });
  if (current.points.length || current.title) sections.push(current);

  function renderPoint(raw, i) {
    const clean = raw.replace(/^[-•]\s*/, '');
    const match = clean.match(/^([A-Za-z0-9À-ÿ/ ]{2,32}):\s*(.+)$/);
    const html = match
      ? `<strong>${escapeHtml(match[1])}:</strong> ${escapeHtml(match[2])}`
      : escapeHtml(clean);
    return `<div class="key-point"><span class="key-num">${i + 1}</span><span class="key-text">${html}</span></div>`;
  }

  return sections.map(sec => `
    ${sec.title ? `<div class="key-section-title">${escapeHtml(sec.title)}</div>` : ''}
    <div class="key-points">${sec.points.map((p, i) => renderPoint(p, i)).join('')}</div>
  `).join('');
}

      </select></div>
      <div class="field"><label>Evidence grade</label><input id="f-evidence" value="${escapeHtml(g.evidence)}" placeholder="e.g. Class I, Level A"></div>
      <div class="field"><label>Attached calculator (optional)</label><select id="f-calculator">
        <option value="" ${!g.calculator?'selected':''}>None</option>
        <option value="curb65" ${g.calculator==='curb65'?'selected':''}>CURB-65 (pneumonia severity)</option>
        <option value="chadsvasc" ${g.calculator==='chadsvasc'?'selected':''}>CHA₂DS₂-VASc (AFib stroke risk)</option>
        <option value="wellspe" ${g.calculator==='wellspe'?'selected':''}>Wells PE (pulmonary embolism probability)</option>
        <option value="qsofa" ${g.calculator==='qsofa'?'selected':''}>qSOFA (sepsis screening)</option>
        <option value="goldabe" ${g.calculator==='goldabe'?'selected':''}>GOLD ABE (COPD classification)</option>
        <option value="bpcategory" ${g.calculator==='bpcategory'?'selected':''}>BP Category (hypertension staging)</option>
        <option value="cervicalscreen" ${g.calculator==='cervicalscreen'?'selected':''}>Cervical cancer screening eligibility</option>
        <option value="crcscreen" ${g.calculator==='crcscreen'?'selected':''}>Colorectal cancer screening eligibility</option>
        <option value="lungscreen" ${g.calculator==='lungscreen'?'selected':''}>Lung cancer screening eligibility</option>
        <option value="osteoscreen" ${g.calculator==='osteoscreen'?'selected':''}>Osteoporosis screening eligibility</option>
        <option value="aaascreen" ${g.calculator==='aaascreen'?'selected':''}>AAA screening eligibility</option>
        <option value="statinaspirin" ${g.calculator==='statinaspirin'?'selected':''}>Statin/aspirin primary prevention</option>
        <option value="diabetesscreen" ${g.calculator==='diabetesscreen'?'selected':''}>Diabetes screening eligibility (BMI)</option>
        <option value="phq9gad7" ${g.calculator==='phq9gad7'?'selected':''}>PHQ-9 / GAD-7 scoring</option>
        <option value="heart" ${g.calculator==='heart'?'selected':''}>HEART Score (chest pain)</option>
        <option value="hasbled" ${g.calculator==='hasbled'?'selected':''}>HAS-BLED (bleeding risk)</option>
        <option value="gbs" ${g.calculator==='gbs'?'selected':''}>Glasgow-Blatchford (GI bleed)</option>
        <option value="ciwa" ${g.calculator==='ciwa'?'selected':''}>CIWA-Ar (alcohol withdrawal)</option>
        <option value="padua" ${g.calculator==='padua'?'selected':''}>Padua Score (VTE prophylaxis)</option>
        <option value="meldna" ${g.calculator==='meldna'?'selected':''}>MELD-Na (liver disease)</option>
      </select></div>
      <div class="field"><label>Key recommendations — use "## Section" for headers, one point per line, "Label: detail" gets bolded</label><textarea id="f-summary" placeholder="e.g.&#10;## Diagnosis&#10;Elevated TSH with low free T4 confirms overt disease&#10;## First-line therapy&#10;Dosing: ~1.6 mcg/kg/day in healthy adults" style="min-height:160px">${escapeHtml(g.summary)}</textarea></div>
      <div class="field"><label>Full text link</label><input id="f-link" value="${escapeHtml(g.link)}" placeholder="https://…"></div>
      <div class="field"><label>Tags (comma-separated)</label><input id="f-tags" value="${escapeHtml(g.tags)}"></div>
      <div class="field"><label>Notes</label><textarea id="f-notes">${escapeHtml(g.notes)}</textarea></div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="goTo('manageList')">Cancel</button>
        <button class="btn btn-primary" onclick="saveForm('${g.id}')">Save</button>
      </div>
    </div>`;
}
async function saveForm(id) {
  const updated = {
    id, name: document.getElementById('f-name').value.trim(), specialty: document.getElementById('f-specialty').value.trim(),
    subspecialty: document.getElementById('f-subspecialty').value.trim(), topic: document.getElementById('f-topic').value.trim(),
    source: document.getElementById('f-source').value.trim(), year: document.getElementById('f-year').value.trim(),
    status: document.getElementById('f-status').value, evidence: document.getElementById('f-evidence').value.trim(),
    calculator: document.getElementById('f-calculator').value,
    summary: document.getElementById('f-summary').value.trim(), link: document.getElementById('f-link').value.trim(),
    tags: document.getElementById('f-tags').value.trim(), notes: document.getElementById('f-notes').value.trim(),
  };
  if (!updated.name || !updated.specialty) { alert('Please fill in at least the guideline name and specialty.'); return; }
  const idx = guidelines.findIndex(x=>x.id===id);
  if (idx>=0) guidelines[idx]=updated; else guidelines.push(updated);
  await saveData(); goTo('manageList');
}
function handleSearch(value) { searchQuery = value; render(); }

loadData();
</script>
